databaseChangeLog:
  - changeSet:
      id: 0008-task-priority
      author: codex
      changes:
        - addColumn:
            tableName: tasks
            columns:
              - column:
                  name: priority
                  type: VARCHAR(16)
                  defaultValue: NONE
                  constraints:
                    nullable: false
        - addCheckConstraint:
            tableName: tasks
            constraintName: ck_tasks_priority
            checkConstraint: priority IN ('NONE', 'LOW', 'NORMAL', 'HIGH', 'CRITICAL')
