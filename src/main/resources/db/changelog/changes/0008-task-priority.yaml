databaseChangeLog:
  - changeSet:
      id: 0008-task-priority
      author: codex
      changes:
        - addColumn:
            tableName: tasks
            columns:
              - column:
                  name: priority
                  type: VARCHAR(16)
                  defaultValue: NONE
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE tasks
              ADD CONSTRAINT ck_tasks_priority
              CHECK (priority IN ('NONE', 'LOW', 'NORMAL', 'HIGH', 'CRITICAL'));
