databaseChangeLog:
  - changeSet:
      id: 0004-add-backlog-task-status
      author: codex
      changes:
        - sql:
            sql: ALTER TABLE tasks DROP CONSTRAINT chk_tasks_status;
        - sql:
            sql: UPDATE tasks SET status = 'BACKLOG' WHERE status = 'OPEN' AND planned_for_at IS NULL;
        - sql:
            sql: ALTER TABLE tasks ADD CONSTRAINT chk_tasks_status CHECK (status IN ('BACKLOG', 'OPEN', 'DONE', 'CLOSED'));
