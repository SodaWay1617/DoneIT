databaseChangeLog:
  - changeSet:
      id: 0006-planned-date
      author: codex
      changes:
        - addColumn:
            tableName: tasks
            columns:
              - column:
                  name: planned_date
                  type: DATE
        - sql:
            sql: |
              ALTER TABLE tasks
              ADD CONSTRAINT ck_tasks_single_planning_value
              CHECK (planned_date IS NULL OR planned_for_at IS NULL);
