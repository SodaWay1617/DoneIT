learn.invite=New to DoneIt?
learn.inviteHint=Learn to plan your day, share projects and track time in eight short topics. Your progress is saved.
learn.begin=Start learning
learn.0.title=Your day in DoneIt
learn.0.lead=DoneIt keeps personal and shared tasks in one place, without making every idea an obligation.
learn.0.point1=Start with Today: active tasks for the selected day and overdue work appear here. Use the date selector to plan another day.
learn.0.point2=Inbox holds NEW tasks. Backlog holds BACKLOG and PAUSED tasks. SPECIFICATION, TODO, IN_PROGRESS and DOCUMENTATION belong to the active list; DONE and CLOSED have a separate list.
learn.0.point3=DONE means completed, CLOSED means cancelled. Set a project and planning type to keep work organized; priority is a separate measure of importance.
learn.0.example=An idea for a trip can wait in Inbox. A researched ticket purchase can move to TODO for Saturday.
learn.0.action=Open Today
learn.1.title=Create a task
learn.1.lead=Start with a clear action. Add details only when they help you get it done.
learn.1.point1=Choose a project, title and status. NEW is for ideas, BACKLOG for accepted work waiting its turn, SPECIFICATION for clarification, TODO for ready-to-do work.
learn.1.point2=Planned date is when you intend to work; deadline is the latest acceptable finish. Use date-only or date-and-time mode. NEW, BACKLOG and PAUSED do not need planning dates.
learn.1.point3=Estimate describes your own work on this task. Open a large task to create subtasks: their estimates and tracked time appear as separate totals, without doubling the daily plan.
learn.1.example=Create “Buy insurance”, TODO, planned for Saturday, deadline on Tuesday, estimate 30 minutes. For a trip epic, make it a separate subtask.
learn.1.action=Open task creation
learn.2.title=List, Kanban and Calendar
learn.2.lead=These are different views of the same tasks. Editing one task changes it everywhere.
learn.2.point1=List is for quick actions and planning a selected day. Project and planning-type filters narrow what you see without changing tasks.
learn.2.point2=Kanban groups tasks by status. Drag a card to move it or reorder it within a column; the order is saved.
learn.2.point3=Calendar shows plans and deadlines. A deadline is highlighted in red; if both dates match, there is one card. Past days show tracked time rather than remaining estimates.
learn.2.example=Plan insurance for the 10th with a deadline on the 15th: the calendar shows the plan on the 10th and a deadline marker on the 15th.
learn.2.action=Open Kanban
learn.3.title=Recurring tasks
learn.3.lead=Use recurring tasks for habits and repeating work, not a fresh task every day.
learn.3.point1=Choose daily, weekdays, weekly, monthly or yearly recurrence. Supported intervals let you repeat every N days, weeks, months or years; weekdays repeat every working day. Time is optional; deadlines are not available.
learn.3.point2=NEW and BACKLOG are inactive preparation. Moving to SPECIFICATION, IN_PROGRESS or DOCUMENTATION activates recurrence from its start date. TODO and PAUSED are unavailable; an active recurring task cannot return to preparation.
learn.3.point3=Done today completes only this occurrence and can record time. Skip today hides it for this day without marking it done or showing it in Calendar. DONE or CLOSED ends the entire series permanently while preserving its history.
learn.3.example=Yoga every two weeks on Saturday: mark Done today after the session. If you miss a session, use Skip today, not CLOSED.
learn.3.action=Open recurring task creation
learn.4.title=Projects and teamwork
learn.4.lead=A project groups related tasks. Shared projects do not make every visible task your responsibility.
learn.4.point1=MAIN is your protected default project. In Projects, select New project and enter its name, code and description. Open the project in List, Kanban or Calendar.
learn.4.point2=The owner edits the project and grants access to selected users; a participant can leave. Choose visibility: all members see all tasks, or only the author and assignees. A task can have several assignees; its details also show the author.
learn.4.point3=Personal workload includes tasks assigned to you, or your own tasks with no assignees. Delegating to someone else removes that estimate from your load, not necessarily from your view. Each assignee receives the full estimate; tracked time and reports remain personal.
learn.4.example=In Work, everyone can see Katya’s clients without receiving their estimates. In Home, author-and-assignees mode keeps unrelated chores out of another member’s list.
learn.4.action=Open projects
learn.5.title=Schedule and daily workload
learn.5.lead=Plan not only how much work there is, but also when there is room for it.
learn.5.point1=Set REQUIRED for commitments, WANTED for desired activities, OPTIONAL for possibilities. Wanted cards have a dashed border; optional cards are translucent. Priority and execution status stay independent.
learn.5.point2=Daily remaining workload sums your active estimates separately for all three types. Completed occurrences and tasks are excluded; missing estimates add no time. Configure workload color thresholds in Settings.
learn.5.point3=Schedule shows one day with your column first and other assignees to the right. Set a start and either estimate or end time to get a time block. Overlaps appear side by side; tasks lacking an interval are listed separately.
learn.5.example=Katya has a client from 10:00 to 11:30. You can see that block and plan a shared errand after 11:30 without adding the client to your workload.
learn.5.action=Open Schedule
learn.6.title=Time tracking and analytics
learn.6.lead=Record actual time manually. Analytics helps you understand your planning, not judge you.
learn.6.point1=Use Track time to add minutes, or enter them when completing a task. Entries accumulate; your time is independent of other participants. Recurring time belongs to the date of the occurrence.
learn.6.point2=Plan / Fact compares completed tasks only: estimate versus your recorded work. It does not lose the estimate after completion. Subtask aggregation follows your analytics preference.
learn.6.point3=Workload analytics uses the dates of all your entries, including unfinished tasks. Review project distribution, planning categories, reschedules and day/week/month/project reports. Historical plans are available only from when their recording began.
learn.6.example=Estimated 30 minutes, recorded 45: after completion, Plan / Fact shows +50%. The 45 minutes also count in the actual workload of the day they were recorded.
learn.6.action=Open Analytics
learn.7.title=Make DoneIt yours
learn.7.lead=Start with a small realistic plan and adjust it as you use DoneIt.
learn.7.point1=Settings controls language, project codes in task titles, workload thresholds and subtask analytics. Return here to adapt the interface to your habits.
learn.7.point2=On a personal device, you can opt into remembering login for 90 days. Remembered devices can be revoked in Settings. The pilot currently uses HTTP, which does not encrypt credentials or tokens; HTTPS is planned.
learn.7.point3=Choose a few Required tasks for tomorrow, add Wanted activities if there is space, then check Schedule. This guide is always available from Today and Settings; it does not create or modify your tasks.
learn.7.example=Try one task with a 30-minute estimate, complete it and record actual time. That is enough to begin building useful personal statistics.
learn.7.action=Open Settings

