<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'DoneIt — ' + #{settings.title}">DoneIt Settings</title>
    <style>
        :root { --bg:#f4efe6; --panel:#fffaf1; --ink:#1f2b2d; --muted:#607074; --accent:#1e6d73; --border:#d8cfbf; }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--bg); color:var(--ink); font:17px Georgia,serif; }
        .shell { width:min(720px,calc(100% - 24px)); margin:24px auto; }
        .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:22px; }
        .bar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
        h1 { margin:0; }
        .setting { display:flex; gap:12px; align-items:flex-start; padding:16px 0; border-top:1px solid var(--border); }
        .setting input { width:20px; height:20px; flex:0 0 auto; }
        .thresholds { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; padding:16px 0; border-top:1px solid var(--border); }
        .thresholds label { display:grid; gap:7px; color:var(--muted); }
        .thresholds input { width:100%; min-height:42px; padding:8px; border:1px solid var(--border); border-radius:6px; font:inherit; }
        @media(max-width:600px){.thresholds{grid-template-columns:1fr}}
        .setting strong { display:block; }
        .setting span { display:block; color:var(--muted); margin-top:5px; }
        button,.button { display:inline-flex; min-height:40px; align-items:center; padding:9px 14px; border:0; border-radius:6px; background:var(--accent); color:white; font:inherit; text-decoration:none; }
        .flash { color:var(--accent); }
    </style>
</head>
<body><main class="shell"><section class="panel">
    <header class="bar"><h1 th:text="#{settings.title}">Settings</h1><a class="button" href="/" th:text="#{nav.tasks}">Tasks</a></header>
    <p class="flash" th:if="${settingsSaved}" th:text="#{settings.saved}">Settings saved.</p>
    <div class="setting">
        <span><strong th:text="#{settings.language}">Language</strong><span th:text="#{settings.languageHint}">Choose language.</span></span>
        <span><a class="button" th:href="@{/settings(lang=en)}" th:text="#{language.english}">English</a> <a class="button" th:href="@{/settings(lang=ru)}" th:text="#{language.russian}">Русский</a></span>
    </div>
    <form method="post" action="/settings">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label class="setting">
            <input type="checkbox" name="showProjectInTaskTitle" value="true" th:checked="${showProjectInTaskTitle}">
            <span><strong th:text="#{settings.projectTitles}">Show project in task titles</strong><span th:text="#{settings.projectTitlesHint}">Add project code.</span></span>
        </label>
        <label class="setting">
            <input type="checkbox" name="rollUpSubtaskTime" value="true" th:checked="${rollUpSubtaskTime}">
            <span><strong th:text="#{settings.rollUpSubtaskTime}">Group subtask time under parent</strong><span th:text="#{settings.rollUpSubtaskTimeHint}">Show child time as parent time in analytics.</span></span>
        </label>
        <div class="setting"><span><strong th:text="#{settings.workload}">Daily workload colors</strong><span th:text="#{settings.workloadHint}">Set limits.</span></span></div>
        <div class="thresholds">
            <label><span th:text="#{settings.greenHours}">Green</span><input type="number" name="workloadGreenHours" min="1" max="23" required th:value="${workload.greenHours}"></label>
            <label><span th:text="#{settings.yellowHours}">Yellow</span><input type="number" name="workloadYellowHours" min="2" max="23" required th:value="${workload.yellowHours}"></label>
            <label><span th:text="#{settings.orangeHours}">Orange</span><input type="number" name="workloadOrangeHours" min="3" max="24" required th:value="${workload.orangeHours}"></label>
        </div>
        <button type="submit" th:text="#{common.save}">Save</button>
    </form>
</section></main></body>
</html>
