<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="#{nav.backlog}">Backlog</title>
    <th:block th:replace="~{app-shell :: assets}"></th:block>
    <link rel="stylesheet" href="/today.css">
    <link rel="stylesheet" href="/compact-list.css">
    <link rel="stylesheet" href="/inbox.css">
    <link rel="stylesheet" href="/backlog.css">
    <script src="/task-context-menu.js" defer></script>
    <script src="/inbox.js" defer></script>
    <script src="/backlog.js" defer></script>
</head>
<body class="app-page app-inbox app-backlog">
<div th:replace="~{app-shell :: navigation}"></div>
<main class="app-content" id="app-main" tabindex="-1">
    <div class="inbox-shell">
        <header class="inbox-header">
            <h1 th:text="#{nav.backlog}">Backlog</h1>
            <a class="today-button today-primary inbox-desktop-create" th:href="@{/tasks/new(backlog=true,projectId=${selectedProjectId},redirectTo=${backlogReturnTo})}"><i data-lucide="plus" aria-hidden="true"></i><span th:text="#{task.create}">Create task</span></a>
            <button class="today-button backlog-filter-toggle" th:classappend="${selectedProjectId != null} ? 'is-active'" type="button" data-backlog-filter aria-haspopup="dialog" aria-controls="backlog-filter-dialog"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span th:text="#{compact.filters}">Filters</span><span class="backlog-filter-mark" th:if="${selectedProjectId != null}" th:aria-label="#{backlog.filterActive}">1</span></button>
        </header>
        <p class="inbox-feedback" role="alert" hidden data-inbox-feedback><span th:text="#{inbox.actionFailed}">Could not update the task.</span><button class="inbox-retry" type="button" data-inbox-retry th:text="#{inbox.retry}">Retry</button></p>
        <section class="compact-list inbox-list" th:if="${!backlogRows.isEmpty()}" data-inbox-list data-return-path="/backlog" th:aria-label="#{nav.backlog}">
            <article class="inbox-row" th:each="row : ${backlogRows}" th:attr="data-task-id=${(row.recurring ? 'r' : 't') + row.id}">
                <a th:replace="~{task-row-summary :: summary(${row}, ${row.estimateMinutes}, ${row.recurring})}"></a>
                <button class="cl-icon" type="button" data-row-menu aria-haspopup="menu" aria-expanded="false" th:title="#{compact.actions}" th:aria-label="#{compact.actions}"><i data-lucide="ellipsis" aria-hidden="true"></i></button>
                <div class="compact-menu inbox-menu" hidden>
                    <button th:unless="${row.recurring}" type="button" data-backlog-schedule th:attr="data-action=${row.base() + '/reschedule'},data-title=${row.title},data-owner=${'t' + row.id}"><i data-lucide="calendar-days" aria-hidden="true"></i><span th:text="#{backlog.schedule}">Schedule</span></button>
                    <a th:if="${row.recurring}" th:href="${row.href()}"><i data-lucide="calendar-days" aria-hidden="true"></i><span th:text="#{backlog.scheduleRecurring}">Configure schedule</span></a>
                    <form th:unless="${row.recurring}" method="post" th:action="${row.base() + '/start-today'}" data-refresh-csrf><input type="hidden" name="redirectTo" th:value="${backlogReturnTo}"><button type="submit"><i data-lucide="play" aria-hidden="true"></i><span th:text="#{inbox.start}">Take on</span></button></form>
                    <a th:href="${row.href()}"><i data-lucide="pencil" aria-hidden="true"></i><span th:text="#{common.edit}">Edit</span></a>
                    <form th:unless="${row.recurring}" method="post" th:action="${row.base() + '/closed'}" data-refresh-csrf><input type="hidden" name="redirectTo" th:value="${backlogReturnTo}"><button type="submit"><i data-lucide="x" aria-hidden="true"></i><span th:text="#{common.close}">Close</span></button></form>
                </div>
            </article>
        </section>
        <div class="inbox-empty" th:if="${backlogRows.isEmpty()}">
            <h2 th:text="${selectedProjectId != null ? #messages.msg('backlog.noMatches') : #messages.msg('backlog.empty')}">Backlog is empty</h2>
            <p th:if="${selectedProjectId == null}" th:text="#{backlog.emptyNote}">Unscheduled tasks will appear here.</p>
            <a th:if="${selectedProjectId != null}" class="today-button" href="/backlog" th:text="#{compact.reset}">Reset filters</a>
        </div>
    </div>
    <dialog class="compact-dialog" id="backlog-filter-dialog" aria-labelledby="backlog-filter-title">
        <header><h2 id="backlog-filter-title" th:text="#{compact.filters}">Filters</h2><button class="cl-icon" type="button" data-close-dialog th:aria-label="#{common.cancel}"><i data-lucide="x" aria-hidden="true"></i></button></header>
        <nav class="backlog-project-options" th:aria-label="#{project.title}">
            <a href="/backlog" th:classappend="${selectedProjectId == null} ? 'is-active'" th:attr="aria-current=${selectedProjectId == null ? 'true' : null}" th:text="#{project.all}">All projects</a>
            <a th:each="p : ${projects}" th:href="@{/backlog(projectId=${p.id})}" th:classappend="${p.id == selectedProjectId} ? 'is-active'" th:attr="aria-current=${p.id == selectedProjectId ? 'true' : null}" th:text="${p.defaultProject ? 'MAIN' : #strings.arraySplit(p.name, '___')[0]}">Project</a>
        </nav>
        <a class="today-button" href="/backlog" th:text="#{compact.reset}">Reset filters</a>
    </dialog>
    <dialog class="compact-dialog" id="backlog-move-dialog" aria-labelledby="backlog-move-title">
        <form method="post" data-refresh-csrf th:attr="data-today=${inboxToday}">
            <header><h2 id="backlog-move-title" th:text="#{backlog.schedule}">Schedule</h2><button class="cl-icon" type="button" data-close-dialog th:aria-label="#{common.cancel}"><i data-lucide="x" aria-hidden="true"></i></button></header>
            <p data-move-task></p><input type="hidden" name="redirectTo" th:value="${backlogReturnTo}">
            <label><span th:text="#{task.plannedDay}">Day</span><input type="date" name="plannedDate" required></label>
            <label class="compact-time-choice"><input type="checkbox" name="plannedWithTime" value="true" data-move-with-time><span th:text="#{task.plannedWithTime}">Exact time</span></label>
            <label data-move-time-label hidden><span th:text="#{form.timeOptional}">Time</span><input type="time" data-move-time></label><input type="hidden" name="plannedForAt" disabled>
            <footer><button type="button" data-close-dialog th:text="#{common.cancel}">Cancel</button><button type="submit" th:text="#{backlog.schedule}">Schedule</button></footer>
        </form>
    </dialog>
</main>
<script src="/reminders.js" defer></script>
</body></html>
