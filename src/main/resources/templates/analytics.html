<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DoneIt Analytics</title><style>
:root{--bg:#f4efe6;--ink:#1f2b2d;--muted:#607074;--accent:#1e6d73;--border:#d8cfbf;--track:#e8e0d3;--bar:#d39145}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px Georgia,serif}.shell{width:min(980px,calc(100% - 24px));margin:24px auto 48px}.header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:24px}.header h1{margin:0 0 6px}.muted,.meta{color:var(--muted)}.nav,.month-nav{display:flex;gap:8px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;min-height:40px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:white;color:inherit;text-decoration:none;font:inherit}.active{background:var(--accent);border-color:var(--accent);color:white}.summary{padding:18px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:24px 0 28px}.summary strong{display:block;font-size:2rem}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:30px}.section h2{margin-top:0}.task,.project{padding:14px 0;border-bottom:1px solid var(--border)}.row{display:flex;justify-content:space-between;gap:14px;align-items:baseline}.task-title{font-weight:bold;color:inherit;text-decoration:none}.meta{font-size:.92rem;margin-top:5px}.track{height:8px;background:var(--track);margin-top:10px;overflow:hidden;border-radius:4px}.fill{height:100%;background:var(--accent)}.project .fill{background:var(--bar)}.empty{padding:22px 0;color:var(--muted)}@media(max-width:720px){.header{display:block}.nav{margin-top:14px}.grid{grid-template-columns:1fr}.row{align-items:flex-start}.row strong{white-space:nowrap}}
</style></head><body><main class="shell">
<header class="header"><div><h1 th:text="#{analytics.title}">Analytics</h1><div class="muted" th:text="${analytics.month}">October 2026</div></div><nav class="nav"><a class="button" href="/" th:text="#{nav.tasks}">Tasks</a><a class="button" href="/kanban" th:text="#{nav.kanban}">Kanban</a><a class="button" href="/calendar" th:text="#{nav.calendar}">Calendar</a><a class="button active" th:href="@{/analytics(month=${analytics.monthValue})}" th:text="#{nav.analytics}">Analytics</a></nav></header>
<div class="month-nav"><a class="button" th:href="@{/analytics(month=${analytics.previousMonthValue})}" th:text="#{nav.previous}">Previous</a><form method="get"><input class="button" type="month" name="month" th:value="${analytics.monthValue}" onchange="this.form.submit()"></form><a class="button" th:href="@{/analytics(month=${analytics.nextMonthValue})}" th:text="#{nav.next}">Next</a></div>
<section class="summary"><span class="muted" th:text="#{analytics.tracked}">Tracked this month</span><strong th:text="${analytics.totalDuration}">0h 0m</strong></section>
<div class="grid"><section class="section"><h2 th:text="#{analytics.topTasks}">Top tasks</h2><div class="empty" th:if="${#lists.isEmpty(analytics.topTasks)}" th:text="#{analytics.empty}">No tracked time for this month.</div>
<article class="task" th:each="task:${analytics.topTasks}"><div class="row"><a class="task-title" th:href="${task.recurring} ? @{/recurring/{id}/edit(id=${task.taskId})} : @{/tasks/{id}/edit(id=${task.taskId})}" th:text="${task.title}">Task</a><strong th:text="${task.duration}">1h 20m</strong></div><div class="meta" th:text="${task.projectName}">Project</div><div class="track"><div class="fill" th:style="'width:'+${task.sharePercent}+'%'"></div></div></article></section>
<section class="section"><h2 th:text="#{analytics.byProject}">By project</h2><div class="empty" th:if="${#lists.isEmpty(analytics.projects)}" th:text="#{analytics.emptyProjects}">No project data yet.</div>
<article class="project" th:each="project:${analytics.projects}"><div class="row"><span th:text="${project.projectName}">Project</span><strong th:text="${project.duration}">1h 20m</strong></div><div class="track"><div class="fill" th:style="'width:'+${project.sharePercent}+'%'"></div></div><div class="meta" th:text="${project.sharePercent}+'%'">50%</div></article></section></div>
</main></body></html>
