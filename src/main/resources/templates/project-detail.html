<!doctype html><html lang='en' xmlns:th='http://www.thymeleaf.org'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width'><title>Project</title><style>body{margin:0;background:#f4efe6;color:#1f2b2d;font:17px Georgia,serif}.shell{width:min(850px,calc(100% - 24px));margin:24px auto}.panel{background:#fffaf1;border:1px solid #d8cfbf;border-radius:8px;padding:20px;margin-bottom:14px}input,textarea,select,button,a{font:inherit}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px;border:1px solid #d8cfbf;border-radius:6px}button,.button{display:inline-block;padding:9px 13px;background:#1e6d73;color:white;border:0;border-radius:6px;text-decoration:none}.danger{background:#9f4d36}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid #d8cfbf;padding:10px 0}.muted{color:#607074}</style></head><body><main class='shell'><p><a class='button' href='/projects'>Projects</a> <a class='button' href='/'>Tasks</a></p><section class='panel'><h1 th:text='${project.name}'>Project</h1><p class='muted' th:text='${project.code}'>CODE</p><p th:text='${project.description}'>Description</p><p th:if='${project.defaultProject}'>Default project cannot be edited or deleted.</p><form th:if='${project.owner and !project.defaultProject}' method='post' th:action='@{/projects/{id}(id=${project.id})}'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><label>Name<input name='name' th:value='${project.name}' required></label><label>Code<input name='code' th:value='${project.code}' required></label><label>Description<textarea name='description' th:text='${project.description}'></textarea></label><button>Save</button></form></section><section class='panel'><h2>Members</h2><div class='row' th:each='u:${members}'><span th:text='${u.login}'>User</span><form th:if='${project.owner and u.id != project.ownerUserId}' method='post' th:action='@{/projects/{id}/members/{uid}/remove(id=${project.id},uid=${u.id})}'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><button class='danger'>Remove</button></form></div><form th:if='${project.owner and !project.defaultProject and !#lists.isEmpty(availableUsers)}' method='post' th:action='@{/projects/{id}/members(id=${project.id})}'><select name='userId' required><option th:each='u:${availableUsers}' th:value='${u.id}' th:text='${u.login}'>user</option></select><button>Grant access</button></form></section><section class='panel' th:if='${!project.defaultProject}'><form th:if='${project.owner}' method='post' th:action='@{/projects/{id}/delete(id=${project.id})}'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><button class='danger'>Delete project</button></form><form th:if='${!project.owner}' method='post' th:action='@{/projects/{id}/leave(id=${project.id})}'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><button class='danger'>Leave project</button></form></section></main></body></html>
