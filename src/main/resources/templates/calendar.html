<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoneIt Calendar</title>
    <style>
        :root {
            --bg: #f4efe6;
            --panel: #fffaf1;
            --ink: #1f2b2d;
            --muted: #607074;
            --accent: #1e6d73;
            --accent-soft: rgba(30, 109, 115, 0.09);
            --border: #d8cfbf;
            --danger: #9f4d36;
            --danger-soft: rgba(159, 77, 54, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: linear-gradient(135deg, #efe7d9, var(--bg));
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
        }
        .shell { width: min(1180px, calc(100% - 24px)); margin: 24px auto 40px; }
        .hero {
            padding: 22px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: rgba(255, 250, 241, 0.94);
            display: flex;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .nav { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
        .pill, .ghost, .item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: white;
            color: inherit;
            text-decoration: none;
        }
        .meta { color: var(--muted); margin: 8px 0 0; }
        .calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; margin-top: 18px; border: 1px solid var(--border); background: var(--border); }
        .weekday, .day { background: rgba(255, 250, 241, 0.96); padding: 10px; min-height: 118px; }
        .weekday { min-height: auto; color: var(--muted); font-size: 0.9rem; }
        .day.outside { background: rgba(255, 250, 241, 0.62); color: var(--muted); }
        .day.today { outline: 2px solid rgba(30, 109, 115, 0.35); outline-offset: -2px; }
        .day-number { font-weight: 700; }
        .items { display: grid; gap: 6px; margin-top: 8px; }
        .item {
            justify-content: flex-start;
            min-height: 30px;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.2;
        }
        .item.deadline { border-color: rgba(159, 77, 54, 0.35); background: var(--danger-soft); color: var(--danger); }
        .item.done, .item.closed { opacity: 0.72; }
        @media (max-width: 760px) {
            .calendar { grid-template-columns: 1fr; }
            .weekday { display: none; }
            .day { min-height: auto; }
        }
    </style>
</head>
<body>
<form method='get' class='project-filter'><select name='projectId' onchange='this.form.submit()'><option value='' th:text="#{project.all}">All projects</option><option th:each='p:${projects}' th:value='${p.id}' th:text='${p.name}' th:selected='${p.id == selectedProjectId}'>Project</option></select> <a href='/projects' th:text="#{project.manage}">Manage projects</a></form>
<div class="shell">
    <section class="hero">
        <div>
            <p class="meta" th:text="#{common.signedInAs(${username})}">Signed in</p>
            <h1 th:text="#{calendar.title(${calendar.month})}">Calendar</h1>
            <div class="nav">
                <a class="pill" th:href="@{/}" th:text="#{nav.list}">List</a>
                <a class="pill" th:href="@{/kanban}" th:text="#{nav.kanban}">Kanban</a>
                <a class="pill" th:href="@{/calendar(month=${calendar.monthValue})}" th:text="#{nav.calendar}">Calendar</a>
                <a class="pill" th:href="@{/analytics(month=${calendar.monthValue})}" th:text="#{nav.analytics}">Analytics</a>
                <a class="ghost" th:href="@{/backlog}" th:text="#{nav.backlog}">Backlog</a>
                <a class="ghost" th:href="@{/inbox}" th:text="#{nav.inbox}">Inbox</a>
                <a class="ghost" th:href="@{/finished}" th:text="#{nav.finished}">Done and closed</a>
                <a class="ghost" th:href="@{/settings}" th:text="#{nav.settings}">Settings</a>
            </div>
        </div>
        <div class="nav">
            <a class="ghost" th:href="@{/calendar(month=${calendar.previousMonthValue})}" th:text="#{nav.previous}">Previous</a>
            <a class="ghost" th:href="@{/calendar(month=${calendar.nextMonthValue})}" th:text="#{nav.next}">Next</a>
        </div>
    </section>

    <section class="calendar">
        <div class="weekday" th:text="#{calendar.mon}">Mon</div>
        <div class="weekday" th:text="#{calendar.tue}">Tue</div>
        <div class="weekday" th:text="#{calendar.wed}">Wed</div>
        <div class="weekday" th:text="#{calendar.thu}">Thu</div>
        <div class="weekday" th:text="#{calendar.fri}">Fri</div>
        <div class="weekday" th:text="#{calendar.sat}">Sat</div>
        <div class="weekday" th:text="#{calendar.sun}">Sun</div>

        <article class="day" th:each="day : ${calendar.days}" th:classappend="${!day.currentMonth} ? ' outside' : (${day.today} ? ' today' : '')">
            <div class="day-number" th:text="${day.date.dayOfMonth}">1</div>
            <div class="items">
                <a class="item"
                   th:each="item : ${day.items}"
                   th:classappend="${item.deadlineHighlighted} ? ' deadline' : (${item.taskStatus.name() == 'DONE'} ? ' done' : (${item.taskStatus.name() == 'CLOSED'} ? ' closed' : ''))"
                   th:href="@{/tasks/{id}/edit(id=${item.taskId})}"
                   th:attr="data-exact-time=${item.exactTime},data-time=${item.exactTime ? #temporals.format(item.dateTime, 'HH:mm') : ''}"
                   th:text="${item.exactTime ? #temporals.format(item.dateTime, 'HH:mm') + ' ' + item.title : item.title}">09:00 Task</a>
                <th:block th:each="occ : ${regularCalendar}">
                    <a class="item" th:if="${occ.date == day.date}" th:classappend="${occ.completed} ? ' done'"
                       th:href="@{/recurring/{id}/edit(id=${occ.task.id})}"
                       th:attr="data-exact-time=${occ.task.occurrenceTime != null},data-time=${occ.task.occurrenceTime != null ? occ.task.occurrenceTime : ''}"
                       th:text="${occ.task.occurrenceTime != null ? occ.task.occurrenceTime + ' ' + occ.task.title : occ.task.title}">Recurring task</a>
                </th:block>
            </div>
        </article>
    </section>
</div>
<script>
    document.querySelectorAll('.day .items').forEach(container => {
        const items = [...container.querySelectorAll(':scope > .item')];
        items.sort((left, right) => {
            const leftExact = left.dataset.exactTime === 'true';
            const rightExact = right.dataset.exactTime === 'true';
            if (leftExact !== rightExact) return leftExact ? -1 : 1;
            if (leftExact) return left.dataset.time.localeCompare(right.dataset.time);
            return 0;
        });
        items.forEach(item => container.appendChild(item));
    });
</script>
</body>
</html>
