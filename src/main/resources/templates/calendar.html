<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="#{nav.calendar}">Calendar</title>
    <th:block th:replace="~{app-shell :: assets}"></th:block>
    <link rel="stylesheet" href="/planning.css">
    <link rel="stylesheet" href="/calendar-month.css">
    <link th:if="${calendarMode == 'week'}" rel="stylesheet" href="/calendar-week.css">
    <script src="/calendar-month.js" defer></script>
    <script th:if="${calendarMode == 'week'}" src="/calendar-week.js" defer></script>
</head>
<body class="app-page app-calendar" th:classappend="${calendarMode == 'week'} ? 'cw-mode'">
<div th:replace="~{app-shell :: navigation}"></div>
<main class="app-content" id="app-main" tabindex="-1">
<div class="mc-shell">
    <header class="mc-header">
        <div class="mc-title">
            <h1 th:text="#{nav.calendar}">Calendar</h1>
            <button class="mc-filter" type="button" data-open-menu="calendar-project-filter" aria-haspopup="dialog" aria-controls="calendar-project-filter" aria-expanded="false" th:classappend="${selectedProjectId != null} ? 'is-active'" th:aria-label="#{compact.filters}">
                <i data-lucide="sliders-horizontal" aria-hidden="true"></i><span th:if="${selectedProjectId != null}" th:aria-label="#{inbox.filterActive}">1</span>
            </button>
        </div>
        <nav class="mc-modes" th:aria-label="#{calendar.viewMode}">
            <a th:href="${overview.monthHref}" th:classappend="${overview.mode == 'month'} ? 'is-active'" th:attr="aria-current=${overview.mode == 'month' ? 'page' : null}" th:text="#{calendar.monthMode}">Month</a>
            <a th:href="${overview.weekHref}" th:classappend="${overview.mode == 'week'} ? 'is-active'" th:attr="aria-current=${overview.mode == 'week' ? 'page' : null}" th:text="#{calendar.weekMode}">Week</a>
        </nav>
        <nav class="mc-controls" th:aria-label="#{calendar.period}">
            <a class="mc-control mc-arrow" th:href="${overview.previousHref}" th:aria-label="${#messages.msg(overview.mode == 'week' ? 'calendar.previousWeek' : 'calendar.previousMonth')}"><i data-lucide="chevron-left" aria-hidden="true"></i></a>
            <details class="mc-picker">
                <summary><span th:text="${overview.monthTitle}">November 2026</span><i data-lucide="chevron-down" aria-hidden="true"></i></summary>
                <form method="get" action="/calendar" class="mc-picker-form">
                    <label th:if="${overview.mode == 'month'}"><span th:text="#{calendar.chooseMonth}">Month and year</span><input type="month" name="month" th:value="${overview.monthValue}" required min="0001-01" max="9998-12"></label>
                    <label th:if="${overview.mode == 'week'}"><span th:text="#{calendar.chooseDay}">Date in the week</span><input type="date" name="date" th:value="${weekView.anchor}" required min="0001-01-01" max="9998-12-31"></label>
                    <input type="hidden" name="mode" th:value="${overview.mode}">
                    <input th:if="${selectedProjectId != null}" type="hidden" name="projectId" th:value="${selectedProjectId}">
                    <input th:if="${selectedPlanningType != null}" type="hidden" name="planningType" th:value="${selectedPlanningType}">
                    <button type="submit" th:text="#{calendar.openPeriod}">Open</button>
                </form>
            </details>
            <a class="mc-control mc-arrow" th:href="${overview.nextHref}" th:aria-label="${#messages.msg(overview.mode == 'week' ? 'calendar.nextWeek' : 'calendar.nextMonth')}"><i data-lucide="chevron-right" aria-hidden="true"></i></a>
            <a class="mc-control mc-today" data-calendar-today th:href="${overview.todayHref}" th:text="#{calendar.today}">Today</a>
        </nav>
    </header>
    <th:block th:if="${overview.mode == 'month'}">
        <section class="mc-grid" th:aria-label="${overview.monthTitle}">
            <div class="mc-weekdays" aria-hidden="true">
                <span class="mc-week-heading">#</span>
                <span th:each="key : ${ {'mon','tue','wed','thu','fri','sat','sun'} }" th:text="${#messages.msg('calendar.' + key)}">Mon</span>
            </div>
            <div class="mc-week" th:each="week : ${overview.weeks}">
                <a class="mc-week-link" th:href="${week.href}" th:aria-label="#{calendar.openWeek(${week.number},${#temporals.format(week.start,'dd.MM.yyyy')})}"><span th:text="${'W' + week.number}">W44</span><i data-lucide="chevron-right" aria-hidden="true"></i></a>
                <article class="mc-day" th:each="day : ${week.days}" th:classappend="${(!day.source.currentMonth ? 'is-outside ' : '') + (day.source.today ? 'is-today' : '')}" th:attr="data-date=${day.source.date}">
                    <a class="mc-day-open" th:href="${day.href}" th:aria-label="#{calendar.daySummary(${#temporals.format(day.source.date,'dd.MM.yyyy')},${@labels.compactDuration(day.minutes)},${day.count})}">
                        <time th:datetime="${day.source.date}"><span th:text="${day.source.date.dayOfMonth}">1</span><small th:if="${!day.source.currentMonth}" th:text="${#temporals.format(day.source.date,'MMM')}">Dec</small></time>
                        <span class="mc-duration" th:text="${@labels.compactDuration(day.minutes)}" th:attr="data-workload-kind=${day.source.actualWorkload ? 'actual' : 'planned'},data-minutes=${day.minutes}" th:title="${#messages.msg(day.source.actualWorkload ? 'planning.actual' : 'tag.estimate')}">0 min</span>
                        <span class="mc-load" th:classappend="${'workload-' + day.level}" aria-hidden="true"><span th:style="${'width:' + day.fill + '%'}"></span></span>
                        <span class="mc-count" th:title="#{calendar.tasksCount(${day.count})}"><i data-lucide="calendar-days" aria-hidden="true"></i><span th:text="${day.count}">0</span></span>
                    </a>
                    <div class="mc-events" th:if="${!day.important.isEmpty()}">
                        <a class="mc-event" th:each="item : ${day.important}" th:href="${item.href}" th:title="${item.title}" th:classappend="${item.deadline ? 'is-deadline' : 'is-critical'}" th:attr="data-important-key=${item.key}">
                            <i th:attr="data-lucide=${item.deadline ? 'alarm-clock' : 'circle-alert'}" aria-hidden="true"></i>
                            <i th:if="${item.deadline and item.critical}" data-lucide="circle-alert" aria-hidden="true"></i>
                            <span class="mc-sr" th:text="${#messages.msg(item.deadline ? 'calendar.deadline' : 'calendar.critical')}">Deadline</span>
                            <span class="mc-event-title" th:text="${item.title}">Task</span>
                        </a>
                    </div>
                    <a class="mc-important-mobile" th:if="${!day.important.isEmpty()}" th:href="${day.weekHref}" th:aria-label="#{calendar.importantCount(${day.important.size()})}">
                        <i th:if="${day.hasDeadline()}" data-lucide="alarm-clock" aria-hidden="true"></i>
                        <i th:if="${day.hasCritical()}" data-lucide="circle-alert" aria-hidden="true"></i>
                        <span class="mc-sr" th:text="${day.important.size()}">1</span>
                    </a>
                </article>
            </div>
        </section>
        <nav class="mc-mobile-weeks" th:aria-label="#{calendar.weeks}">
            <a th:each="week : ${overview.weeks}" th:href="${week.href}" th:aria-label="#{calendar.openWeek(${week.number},${#temporals.format(week.start,'dd.MM.yyyy')})}" th:text="${'W' + week.number}">W44</a>
        </nav>
    </th:block>
    <section th:if="${overview.mode == 'week'}" class="cw-container">
        <div th:replace="~{calendar-week :: week}"></div>
    </section>
</div>
<dialog id="calendar-project-filter" class="app-menu mc-filter-dialog" aria-labelledby="calendar-project-title">
    <header class="app-menu-header"><h2 id="calendar-project-title" th:text="#{project.title}">Projects</h2><button class="mc-control mc-arrow" type="button" data-close-menu th:aria-label="#{common.cancel}"><i data-lucide="x" aria-hidden="true"></i></button></header>
    <nav class="mc-project-options" th:aria-label="#{project.title}">
        <a th:href="${appNav.allProjectsHref}" th:classappend="${appNav.allProjectsActive} ? 'is-active'" th:attr="aria-current=${appNav.allProjectsActive ? 'true' : null}" th:text="#{project.all}">All projects</a>
        <a th:each="p : ${appNav.projects}" th:href="${p.href}" th:classappend="${p.active} ? 'is-active'" th:attr="aria-current=${p.active ? 'true' : null}" th:text="${p.name}">Project</a>
    </nav>
    <a class="mc-filter-reset" th:href="${appNav.allProjectsHref}" th:text="#{compact.reset}">Reset</a>
</dialog>
</main>
<script src="/reminders.js" defer></script>
</body></html>
