<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>DoneIt Tasks</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4efe6;
            --panel: #fffaf1;
            --ink: #1f2b2d;
            --muted: #607074;
            --accent: #1e6d73;
            --accent-soft: rgba(30, 109, 115, 0.09);
            --border: #d8cfbf;
            --danger: #9f4d36;
            --danger-soft: rgba(159, 77, 54, 0.1);
            --shadow: rgba(31, 43, 45, 0.06);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
        }

        .shell {
            width: min(1180px, calc(100% - 24px));
            margin: 24px auto 40px;
        }





        .actions, .nav, .date-picker, .task-actions, .reschedule-form, .bulk-action, .random-action, .badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .actions { justify-content: flex-end; }
        .nav { margin-top: 18px; }
        .date-picker { margin-top: 14px; }
        .bulk-action { margin-top: 14px; }
        .random-action { margin-top: 14px; }
        .task-actions { margin-top: 12px; }
        .reschedule-form { margin-top: 12px; }
        .reschedule-form [hidden] { display: none; }
        .reschedule-form .compact-input { min-width: 0; width: 220px; max-width: 100%; }
        .reschedule-mode { display: inline-flex; gap: 6px; align-items: center; }
        .badges { gap: 8px; }

        .pill, .ghost, .solid, .logout, .date-input, .secondary, .compact-input, .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            background: rgba(255, 255, 255, 0.72);
            font: inherit;
        }

        .badge {
            min-height: 30px;
            padding: 6px 10px;
            font-size: 0.82rem;
            letter-spacing: 0.03em;
        }

        .date-input, .compact-input {
            justify-content: flex-start;
        }

        .compact-input {
            min-width: 220px;
        }

        .solid {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .secondary {
            background: rgba(31, 43, 45, 0.06);
        }

        .pill.active {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: rgba(30, 109, 115, 0.22);
        }

        .badge.status-open,
        .badge.status-today {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: rgba(30, 109, 115, 0.22);
        }

        .badge.status-done,
        .badge.status-closed,
        .badge.status-backlog {
            background: rgba(31, 43, 45, 0.06);
            color: var(--ink);
        }

        .badge.status-overdue {
            background: var(--danger-soft);
            color: var(--danger);
            border-color: rgba(159, 77, 54, 0.28);
        }
        .badge.workload { font-weight: bold; }
        .badge.workload-green { border-color:#79a982; background:#e4f2e7; color:#245f30; }
        .badge.workload-yellow { border-color:#d2b54c; background:#fff5c9; color:#6d5700; }
        .badge.workload-orange { border-color:#d58a46; background:#ffead6; color:#85450c; }
        .badge.workload-red { border-color:#c36a5b; background:#fbe1dc; color:#812d20; }
        .badge.priority-low { color: var(--muted); }
        .badge.priority-normal { color: var(--accent); border-color: rgba(30, 109, 115, 0.22); }
        .badge.priority-high { color: var(--danger); border-color: rgba(159, 77, 54, 0.28); }
        .badge.priority-critical { color: white; background: var(--danger); border-color: var(--danger); }



        .section-note {
            margin: -4px 0 14px;
            color: var(--muted);
        }

        .logout { cursor: pointer; }

        .flash {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 16px;
            background: var(--accent-soft);
            color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: 1.55fr 0.95fr;
            gap: 16px;
            margin-top: 18px;
        }

        .card {
            padding: 22px;
            border-radius: 22px;
            border: 1px solid var(--border);
            background: rgba(255, 250, 241, 0.94);
            box-shadow: 0 14px 30px var(--shadow);
        }

        .card h2, .card h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.2rem;
        }

        .stack {
            display: grid;
            gap: 12px;
        }

        .task {
            padding: 14px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: white;
        }

        .task.overdue {
            border-color: rgba(159, 77, 54, 0.32);
            background: linear-gradient(180deg, var(--danger-soft), white);
        }

        .task.backlog-task {
            background: linear-gradient(180deg, rgba(31, 43, 45, 0.04), white);
        }

        .task.completed-task {
            background: linear-gradient(180deg, rgba(31, 43, 45, 0.04), rgba(255, 255, 255, 0.96));
            border-style: dashed;
        }

        .task-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
        }

        .task-top-main {
            display: grid;
            gap: 8px;
        }

        .task-title {
            margin: 0;
            font-size: 1.05rem;
        }

        .meta {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .empty {
            margin: 0;
            color: var(--muted);
        }

        form.inline {
            margin: 0;
        }

        @media (max-width: 940px) {
            .grid {
                grid-template-columns: 1fr;
            }


            .actions {
                justify-content: flex-start;
            }
        }
    </style>
<link rel="stylesheet" href="/planning.css">
<link rel="stylesheet" href="/today.css">
<script src="/today.js" defer></script>
<th:block th:replace="~{app-shell :: assets}"></th:block><link rel="stylesheet" href="/compact-list.css"><link rel="stylesheet" href="/day-sidebar.css"><script src="/day-sidebar.js" defer></script></head>
<body class="app-page"><div th:replace="~{app-shell :: navigation}"></div><div class="app-content app-tasks" id="app-main" tabindex="-1">
<div class="shell">
    <header class="today-header">
        <div class="today-heading">
            <p class="today-eyebrow" th:text="${selectedDayIsToday} ? #{task.todayView} : #{task.selectedDateView}">Today</p>
            <h1 th:text="${#temporals.format(daily.selectedDate, 'dd MMM yyyy')}">08 Apr 2026</h1>
            <p class="today-weekday" th:text="${#temporals.format(daily.selectedDate, 'EEEE')}">Wednesday</p>
        </div>
        <div class="today-controls">
            <nav class="today-day-navigation" th:aria-label="#{today.dayNavigation}">
                <a class="today-button today-icon" th:href="@{/tasks(date=${daily.selectedDate.minusDays(1)},projectId=${selectedProjectId},planningType=${selectedPlanningType})}" th:title="#{nav.previousDay}" th:aria-label="#{nav.previousDay}"><i data-lucide="chevron-left" aria-hidden="true"></i></a>
                <details class="today-date-picker">
                    <summary class="today-button"><i data-lucide="calendar-days" aria-hidden="true"></i><span th:text="#{task.jumpDate}">Jump to date</span></summary>
                    <form method="get" th:action="@{/tasks}">
                        <label for="selectedDate" th:text="#{task.jumpDate}">Jump to date</label>
                        <input id="selectedDate" type="date" name="date" required th:value="${daily.selectedDate}" />
                        <input type="hidden" name="projectId" th:if="${selectedProjectId != null}" th:value="${selectedProjectId}">
                        <input type="hidden" name="planningType" th:if="${selectedPlanningType != null}" th:value="${selectedPlanningType}">
                        <button class="today-button today-primary" type="submit" th:text="#{task.openDay}">Open day</button>
                    </form>
                </details>
                <a class="today-button today-icon" th:href="@{/tasks(date=${daily.selectedDate.plusDays(1)},projectId=${selectedProjectId},planningType=${selectedPlanningType})}" th:title="#{nav.nextDay}" th:aria-label="#{nav.nextDay}"><i data-lucide="chevron-right" aria-hidden="true"></i></a>
            </nav>
            <div th:replace="~{day-sidebar :: create}"></div>
        </div>
    </header>
    <section class="today-summary" th:aria-label="#{today.summary}" data-workload-kind="planned"
             th:with="total=${planningLoad.totalMinutes()},requiredEnd=${total > 0 ? 100.0 * planningLoad.requiredMinutes / total : 0},wantedEnd=${total > 0 ? 100.0 * (planningLoad.requiredMinutes + planningLoad.wantedMinutes) / total : 0}">
        <div class="today-ring" role="img" th:classappend="${total == 0} ? 'is-empty'"
             th:style="${'--required-end:' + requiredEnd + '%;--wanted-end:' + wantedEnd + '%;'}"
             th:aria-label="${total == 0 ? #messages.msg('today.noEstimate') : #messages.msg('today.distribution', @labels.compactDuration(planningLoad.requiredMinutes), @labels.compactDuration(planningLoad.wantedMinutes), @labels.compactDuration(planningLoad.optionalMinutes))}"
             th:title="${total == 0 ? #messages.msg('today.noEstimate') : #messages.msg('today.total', @labels.compactDuration(total))}"></div>
        <div class="today-metric" th:each="type : ${planningTypes}" th:with="minutes=${planningLoad.minutes(type)}"
             th:attr="data-planning-type=${type},data-minutes=${minutes}" th:classappend="${' workload-' + workloadSettings.level(minutes)}">
            <strong th:text="${@labels.compactDuration(minutes)}">0 h</strong>
            <span class="today-metric-label"><span class="today-swatch" th:classappend="${type.name().toLowerCase()}" aria-hidden="true"></span><span th:text="${@labels.planning(type)}">Required</span></span>
        </div>
        <div class="today-metric today-active-count"><strong th:text="${daily.activeTaskCount() + regularActive.size()}">0</strong><span th:text="#{today.activeTasks}">Active tasks</span></div>
    </section>
    <aside class="today-onboarding" th:if="${learningProgress != null && learningProgress.invite()}" aria-labelledby="learning-invite">
        <i class="today-learning-icon" data-lucide="graduation-cap" aria-hidden="true"></i>
        <div class="today-learning-content">
            <h2 id="learning-invite" th:text="${learningProgress.count() > 0} ? #{today.continueLearning} : #{learn.invite}">New to DoneIt?</h2>
            <p th:text="#{learn.inviteHint}">Eight short topics. Continue whenever you like.</p>
            <p class="today-learning-progress" th:if="${learningProgress.count() > 0}" th:text="#{learn.progress(${learningProgress.count()},8)}">Progress</p>
            <div class="today-learning-actions">
                <a class="today-button today-primary" href="/learn" th:text="${learningProgress.count() > 0} ? #{learn.resume} : #{learn.begin}">Start learning</a>
                <form method="post" th:action="@{/learn/dismiss}"><button class="today-button" type="submit" th:text="#{learn.later}">Later</button></form>
            </div>
        </div>
        <form class="today-learning-dismiss" method="post" th:action="@{/learn/dismiss}"><button class="today-button today-icon" type="submit" th:title="#{today.hideLearning}" th:aria-label="#{today.hideLearning}"><i data-lucide="x" aria-hidden="true"></i></button></form>
    </aside>
    <div class="flash" th:if="${flashMessage != null}" th:text="${flashMessage}">Task created.</div>
    <div class="flash" th:if="${randomTaskTitle != null}" th:text="#{task.randomResult(${randomTaskTitle})}">Random task</div>

    <div class="grid">
        <section th:replace="~{compact-list :: list}"></section>

        <aside th:replace="~{day-sidebar :: sidebar}"></aside>
    </div>
</div>
<dialog th:replace="~{compact-list :: move-dialog}"></dialog>
<script src="/compact-list.js"></script>
<script src="/time-tracking.js"></script>
<script src="/reschedule.js"></script>
<script src="/planning.js"></script>
<script src="/reminders.js" defer></script></div></body>
</html>
