<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title th:text="${pageTitle}">Tasks</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4efe6;color:#1f2b2d;font-family:Georgia,serif}.shell{width:min(920px,calc(100% - 24px));margin:24px auto}.panel,.task{background:#fffaf1;border:1px solid #d8cfbf;border-radius:8px;padding:20px}.nav,.badges,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:12px;margin-top:16px}.task{background:white}.badge,a,button{font:inherit;border:1px solid #d8cfbf;border-radius:6px;padding:8px 11px;background:white;color:inherit;text-decoration:none}.badge{font-size:.82rem}.meta{color:#607074}.empty{margin-top:16px}
</style><link rel="stylesheet" href="/planning.css">
<th:block th:replace="~{app-shell :: assets}"></th:block></head><body class="app-page"><div th:replace="~{app-shell :: navigation}"></div><div class="app-content" id="app-main" tabindex="-1"><div th:replace="~{planning :: filters}"></div>
<main class="shell"><header class="panel"><h1 th:text="${listKind == 'inbox'} ? #{status.inboxTitle} : #{status.finishedTitle}">Tasks</h1><p class="meta" th:text="${listKind == 'inbox'} ? #{status.inboxNote} : #{status.finishedNote}">Tasks</p></header>
<section class="stack">
 <article class="task" th:each="task:${taskCollection.tasks}" th:classappend="${' planning-' + task.planningType.name().toLowerCase()}"><div class="badges"><span class="badge" th:text="${@labels.status(task.status)}">Status</span></div><h2 th:text="${task.title}">Task</h2><div th:replace="~{task-tags :: badges(${taskTags[task.id]})}"></div><p class="meta" th:if="${taskAssignees[task.id] != null}" th:text="#{assignment.list(${#strings.listJoin(taskAssignees[task.id], ', ')})}">Assignees</p><p class="meta" th:if="${task.description != null}" th:text="${task.description}">Description</p><p class="meta" th:if="${task.estimateMinutes != null}" th:text="#{common.estimate(${task.estimateMinutes})}">Estimate</p><a th:href="@{/tasks/{id}/edit(id=${task.id})}" th:text="#{common.edit}">Edit</a></article>
 <th:block th:with="regularTasks=${listKind == 'inbox' ? regularInbox : regularFinished}">
  <article class="task" th:each="task:${regularTasks}" th:classappend="${' planning-' + task.planningType.name().toLowerCase()}"><div class="badges"><span class="badge" th:text="${@labels.status(task.status)}">Status</span><span class="badge" th:text="#{task.recurring}">RECURRING</span></div><h2 th:text="${task.title}">Task</h2><div th:replace="~{task-tags :: badges(${regularTaskTags[task.id]})}"></div><p class="meta" th:if="${regularTaskAssignees[task.id] != null}" th:text="#{assignment.list(${#strings.listJoin(regularTaskAssignees[task.id], ', ')})}">Assignees</p><p class="meta" th:if="${task.description != null}" th:text="${task.description}">Description</p><p class="meta" th:if="${task.estimateMinutes != null}" th:text="#{common.estimate(${task.estimateMinutes})}">Estimate</p><a th:href="@{/recurring/{id}/edit(id=${task.id})}" th:text="#{common.edit}">Edit</a></article>
  <p class="empty" th:if="${#lists.isEmpty(taskCollection.tasks) and #lists.isEmpty(regularTasks)}" th:text="#{common.noTasks}">No tasks here.</p>
 </th:block>
</section></main><script src="/time-tracking.js"></script><script src="/planning.js"></script>
<script src="/reminders.js" defer></script></div></body></html>
