<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${pageTitle}">Tasks</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4efe6;color:#1f2b2d;font-family:Georgia,serif}.shell{width:min(920px,calc(100% - 24px));margin:24px auto}.panel,.task{background:#fffaf1;border:1px solid #d8cfbf;border-radius:8px;padding:20px}.nav,.badges,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:12px;margin-top:16px}.task{background:white}.badge,a,button{font:inherit;border:1px solid #d8cfbf;border-radius:6px;padding:8px 11px;background:white;color:inherit;text-decoration:none}.badge{font-size:.82rem}.meta{color:#607074}.empty{margin-top:16px}
</style></head><body><form method="get"><select name="projectId" onchange="this.form.submit()"><option value="" th:text="#{project.all}">All projects</option><option th:each="p:${projects}" th:value="${p.id}" th:text="${p.name}" th:selected="${p.id == selectedProjectId}">Project</option></select></form>
<main class="shell"><header class="panel"><h1 th:text="${listKind == 'inbox'} ? #{status.inboxTitle} : #{status.finishedTitle}">Tasks</h1><p class="meta" th:text="${listKind == 'inbox'} ? #{status.inboxNote} : #{status.finishedNote}">Tasks</p><nav class="nav"><a href="/" th:text="#{nav.today}">Today</a><a href="/inbox" th:text="#{nav.inbox}">Inbox</a><a href="/backlog" th:text="#{nav.backlog}">Backlog</a><a href="/finished" th:text="#{nav.finished}">Done and closed</a><a href="/kanban" th:text="#{nav.kanban}">Kanban</a><a href="/calendar" th:text="#{nav.calendar}">Calendar</a></nav></header>
<section class="stack">
 <article class="task" th:each="task:${taskCollection.tasks}"><div class="badges"><span class="badge" th:text="${@labels.status(task.status)}">Status</span></div><h2 th:text="${task.title}">Task</h2><p class="meta" th:if="${taskAssignees[task.id] != null}" th:text="#{assignment.list(${#strings.listJoin(taskAssignees[task.id], ', ')})}">Assignees</p><p class="meta" th:if="${task.description != null}" th:text="${task.description}">Description</p><p class="meta" th:if="${task.estimateMinutes != null}" th:text="#{common.estimate(${task.estimateMinutes})}">Estimate</p><a th:href="@{/tasks/{id}/edit(id=${task.id})}" th:text="#{common.edit}">Edit</a></article>
 <th:block th:with="regularTasks=${listKind == 'inbox' ? regularInbox : regularFinished}">
  <article class="task" th:each="task:${regularTasks}"><div class="badges"><span class="badge" th:text="${@labels.status(task.status)}">Status</span><span class="badge" th:text="#{task.recurring}">RECURRING</span></div><h2 th:text="${task.title}">Task</h2><p class="meta" th:if="${regularTaskAssignees[task.id] != null}" th:text="#{assignment.list(${#strings.listJoin(regularTaskAssignees[task.id], ', ')})}">Assignees</p><p class="meta" th:if="${task.description != null}" th:text="${task.description}">Description</p><p class="meta" th:if="${task.estimateMinutes != null}" th:text="#{common.estimate(${task.estimateMinutes})}">Estimate</p><a th:href="@{/recurring/{id}/edit(id=${task.id})}" th:text="#{common.edit}">Edit</a></article>
  <p class="empty" th:if="${#lists.isEmpty(taskCollection.tasks) and #lists.isEmpty(regularTasks)}" th:text="#{common.noTasks}">No tasks here.</p>
 </th:block>
</section></main><script src="/time-tracking.js"></script></body></html>
