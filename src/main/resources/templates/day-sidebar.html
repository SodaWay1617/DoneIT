<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="create" class="day-create-split">
    <a class="today-button today-primary today-create day-create-main" href="/tasks/new"><i data-lucide="plus" aria-hidden="true"></i><span th:text="#{task.create}">Create task</span></a>
    <details class="day-create-choice">
        <summary class="today-button today-primary" th:title="#{day.createType}" th:aria-label="#{day.createType}"><i class="day-create-arrow" data-lucide="chevron-down" aria-hidden="true"></i><i class="day-create-mobile-icon" data-lucide="plus" aria-hidden="true"></i></summary>
        <div class="day-create-options">
            <a href="/tasks/new"><i data-lucide="check-square" aria-hidden="true"></i><span th:text="#{day.ordinary}">Ordinary task</span></a>
            <a href="/recurring/new"><i data-lucide="repeat" aria-hidden="true"></i><span th:text="#{day.recurring}">Recurring task</span></a>
        </div>
    </details>
</div>
<aside th:fragment="sidebar" class="day-sidebar">
    <section class="day-mini-calendar" aria-labelledby="day-calendar-title">
        <h2 id="day-calendar-title" th:text="#{nav.calendar}">Calendar</h2>
        <header class="day-calendar-heading"><h3 th:text="${miniCalendar.title}">October 2026</h3>
            <nav th:aria-label="#{day.monthNavigation}">
                <a class="day-month-button" th:if="${miniCalendar.previousHref != null}" th:href="${miniCalendar.previousHref}" th:title="#{day.previousMonth}" th:aria-label="#{day.previousMonth}"><i data-lucide="chevron-left" aria-hidden="true"></i></a>
                <button class="day-month-button" th:if="${miniCalendar.previousHref == null}" type="button" disabled th:aria-label="#{day.previousMonth}"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
                <a class="day-month-button" th:if="${miniCalendar.nextHref != null}" th:href="${miniCalendar.nextHref}" th:title="#{day.nextMonth}" th:aria-label="#{day.nextMonth}"><i data-lucide="chevron-right" aria-hidden="true"></i></a>
                <button class="day-month-button" th:if="${miniCalendar.nextHref == null}" type="button" disabled th:aria-label="#{day.nextMonth}"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
            </nav>
        </header>
        <div class="day-calendar-weekdays" aria-hidden="true"><span th:each="day : ${miniCalendar.weekdays}" th:text="${day}">Mon</span></div>
        <nav class="day-calendar-grid" th:aria-label="#{day.chooseDay}">
            <a th:each="day : ${miniCalendar.days}" th:href="${day.href}" th:text="${day.date.dayOfMonth}"
               th:classappend="${(day.selected ? 'is-selected ' : '') + (day.today ? 'is-today ' : '') + (!day.currentMonth ? 'is-outside' : '')}"
               th:attr="data-date=${day.date},aria-current=${day.selected ? 'date' : null}"
               th:aria-label="${day.selected ? #messages.msg('day.selectedDay',day.label) : (day.today ? #messages.msg('day.todayDay',day.label) : day.label)}">24</a>
        </nav>
    </section>
    <section class="day-schedule" aria-labelledby="day-schedule-title">
        <h2 id="day-schedule-title" th:text="#{day.schedule}">Day schedule</h2>
        <p class="day-schedule-empty" th:if="${daySchedule.isEmpty()}" th:text="#{day.noTimedTasks}">No timed tasks for this day.</p>
        <div class="day-schedule-list" th:if="${!daySchedule.isEmpty()}" tabindex="0" th:aria-label="#{day.schedule}">
            <a class="day-schedule-entry" th:each="row : ${daySchedule}" th:href="${row.href()}" th:attr="data-task-id=${row.id},data-recurring=${row.recurring},data-start=${row.start}">
                <time th:text="${#temporals.format(row.start, 'HH:mm')}">09:00</time>
                <span class="day-schedule-dot" th:classappend="${'priority-' + row.priority.name().toLowerCase()}" aria-hidden="true"></span>
                <span class="day-schedule-task"><strong th:text="${row.title}">Task</strong>
                    <small th:if="${row.estimateMinutes != null}" th:text="${@labels.compactDuration(row.estimateMinutes)}">30 min</small>
                    <small th:if="${row.interval.length() > 5}" th:text="${row.interval + (row.nextDays > 0 ? ' · ' + #messages.msg('compact.nextDays',row.nextDays) : '')}">09:00–09:30</small>
                </span>
            </a>
        </div>
    </section>
    <section class="today-tools day-tools" aria-labelledby="today-actions-title">
        <h2 id="today-actions-title" th:text="#{today.actions}">Actions</h2>
        <div class="today-quick-actions-body">
            <form class="bulk-action" method="post" th:action="@{/tasks/bulk-move-to-tomorrow}" data-bulk-confirm="shift" data-refresh-csrf
                  th:attr="data-date=${daily.selectedDate},data-confirm=#{day.confirmShift},data-failure=#{day.previewFailed},data-empty=#{day.nothingToMove},data-user=${appUserLogin}">
                <input type="hidden" name="date" th:value="${daily.selectedDate}">
                <input type="hidden" name="redirectTo" th:value="${compactReturnTo}">
                <button class="secondary" type="submit" disabled><i data-lucide="calendar-arrow-up" aria-hidden="true"></i><span><span th:text="#{day.shift}">Shift unfinished tasks by one day</span><small th:text="#{day.shiftScope(${#temporals.format(daily.selectedDate, 'dd.MM.yyyy')})}">All projects</small></span><span class="day-action-count" th:text="${dayBulkPreview.shiftCount}">0</span></button>
            </form>
            <form class="bulk-action" method="post" th:action="@{/tasks/bulk-move-overdue-to-today}" data-bulk-confirm="overdue" data-refresh-csrf
                  th:attr="data-date=${daily.selectedDate},data-confirm=#{day.confirmOverdue},data-failure=#{day.previewFailed},data-empty=#{day.nothingToMove},data-user=${appUserLogin}">
                <button class="secondary" type="submit" disabled><i data-lucide="calendar-check" aria-hidden="true"></i><span><span th:text="#{task.moveOverdue}">Move overdue to today</span><small th:text="#{day.overdueScope(${#temporals.format(dayRealToday, 'dd.MM.yyyy')})}">Real today</small></span><span class="day-action-count" th:text="${dayBulkPreview.overdueCount}">0</span></button>
            </form>
            <form class="random-action" method="post" th:action="@{/tasks/random-today}" data-refresh-csrf>
                <button class="secondary" type="submit"><i data-lucide="shuffle" aria-hidden="true"></i><span><span th:text="#{day.random}">Random task for today</span><small th:text="#{day.overdueScope(${#temporals.format(dayRealToday, 'dd.MM.yyyy')})}">Real today</small></span></button>
            </form>
        </div>
    </section>
</aside>
</body></html>
