<!doctype html>
<html th:lang='${#locale.language}' xmlns:th='http://www.thymeleaf.org'>
<head><meta charset='utf-8'><meta name='viewport' content='width=device-width'><title>Projects</title>
<style>body{margin:0;background:#f4efe6;color:#1f2b2d;font:17px Georgia,serif}.shell{width:min(1000px,calc(100% - 24px));margin:24px auto}.bar,.item,.create{background:#fffaf1;border:1px solid #d8cfbf;border-radius:8px;padding:20px;margin-bottom:14px}.bar{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,textarea,button,a{font:inherit}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px;border:1px solid #d8cfbf;border-radius:6px}button,.button{display:inline-block;padding:10px 14px;background:#1e6d73;color:white;border:0;border-radius:6px;text-decoration:none}.muted{color:#607074}.tag{font:13px sans-serif;color:#1e6d73}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head>
<body><main class='shell'>
<header class='bar'><div><h1 th:text="#{project.title}">Projects</h1><span class='muted' th:text="#{project.subtitle}">Task spaces available to you</span></div><div><a class='button' href='/settings' th:text="#{nav.settings}">Settings</a> <a class='button' href='/' th:text="#{nav.tasks}">Tasks</a></div></header>
<section class='create'><h2 th:text="#{project.new}">New project</h2><form method='post' action='/projects'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><label><span th:text="#{project.name}">Name</span><input name='name' required maxlength='120'></label><label><span th:text="#{project.code}">Code</span><input name='code' required maxlength='40' placeholder='WORK'></label><label><span th:text="#{common.description}">Description</span><textarea name='description'></textarea></label><button th:text="#{project.create}">Create</button></form></section>
<section class='grid'><article class='item' th:each='p:${projects}'><span class='tag' th:text='${p.code}'>CODE</span><h2 th:text='${p.name}'>Name</h2><p class='muted' th:text='${p.description}'>Description</p><span class='tag' th:if='${p.defaultProject}' th:text="#{project.default}">DEFAULT</span><span class='tag' th:if='${!p.defaultProject and p.owner}' th:text="#{project.owner}">OWNER</span><span class='tag' th:if='${!p.owner}' th:text="#{project.member}">MEMBER</span> <a class='button' th:href='@{/projects/{id}(id=${p.id})}' th:text="#{project.open}">Open</a></article></section>
</main></body></html>
