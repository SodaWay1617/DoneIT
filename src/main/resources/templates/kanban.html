<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoneIt Kanban</title>
    <style>
        :root {
            --bg: #f4efe6;
            --panel: #fffaf1;
            --ink: #1f2b2d;
            --muted: #607074;
            --accent: #1e6d73;
            --accent-soft: rgba(30, 109, 115, 0.09);
            --border: #d8cfbf;
            --danger: #9f4d36;
            --danger-soft: rgba(159, 77, 54, 0.1);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: linear-gradient(135deg, #efe7d9, var(--bg));
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
        }

        .shell { width: min(1180px, calc(100% - 24px)); margin: 24px auto 40px; }
        .hero, .column {
            border: 1px solid var(--border);
            border-radius: 22px;
            background: rgba(255, 250, 241, 0.94);
            padding: 22px;
        }
        .hero { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .nav, .date-picker, .badges, .task-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .nav, .date-picker { margin-top: 14px; }
        .pill, .ghost, .solid, .secondary, .date-input, .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 9px 13px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: white;
            color: inherit;
            font: inherit;
            text-decoration: none;
        }
        .solid { background: var(--accent); border-color: var(--accent); color: white; }
        .secondary { background: rgba(31, 43, 45, 0.06); }
        .badge { min-height: 28px; font-size: 0.82rem; }
        .badge.open { background: var(--accent-soft); color: var(--accent); }
        .badge.done { background: rgba(30, 109, 115, 0.12); }
        .badge.closed { background: var(--danger-soft); color: var(--danger); }
        .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
        .column h2 { margin: 0 0 12px; font-size: 1.1rem; }
        .stack { display: grid; gap: 12px; }
        .task { padding: 14px; border: 1px solid var(--border); border-radius: 16px; background: white; }
        .task h3 { margin: 8px 0 0; font-size: 1rem; }
        .meta { margin: 8px 0 0; color: var(--muted); }
        .task-actions { margin-top: 12px; }
        form.inline { margin: 0; }
        @media (max-width: 940px) { .board { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="shell">
    <section class="hero">
        <div>
            <p class="meta">Signed in as <span th:text="${username}">doneit</span></p>
            <h1 th:text="'Kanban - ' + ${#temporals.format(kanban.selectedDate, 'dd MMM yyyy')}">Kanban</h1>
            <div class="nav">
                <a class="pill" th:href="@{/}">List</a>
                <a class="pill" th:href="@{/kanban(date=${kanban.selectedDate})}">Kanban</a>
                <a class="pill" th:href="@{/calendar(month=${#temporals.format(kanban.selectedDate, 'yyyy-MM')})}">Calendar</a>
                <a class="ghost" th:href="@{/backlog}">Backlog</a>
            </div>
            <form class="date-picker" method="get" th:action="@{/kanban}">
                <input class="date-input" type="date" name="date" th:value="${#temporals.format(kanban.selectedDate, 'yyyy-MM-dd')}" />
                <button class="secondary" type="submit">Open day</button>
            </form>
        </div>
        <a class="solid" th:href="@{/tasks/new}">Create task</a>
    </section>

    <main class="board">
        <section class="column">
            <h2 th:text="'Open (' + ${kanban.openTasks.size()} + ')'">Open</h2>
            <div class="stack" th:if="!${#lists.isEmpty(kanban.openTasks)}">
                <article class="task" th:each="task : ${kanban.openTasks}">
                    <div class="badges"><span class="badge open">OPEN</span></div>
                    <h3 th:text="${task.title}">Task</h3>
                    <p class="meta" th:if="${task.plannedForAt != null}" th:text="${#temporals.format(task.plannedForAt, 'HH:mm')}">09:00</p>
                    <p class="meta" th:if="${task.description != null and !task.description.isBlank()}" th:text="${task.description}">Description</p>
                    <div class="task-actions">
                        <a class="ghost" th:href="@{/tasks/{id}/edit(id=${task.id})}">Edit</a>
                        <form class="inline" method="post" th:action="@{/tasks/{id}/done(id=${task.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="redirectTo" th:value="'/kanban?date=' + ${#temporals.format(kanban.selectedDate, 'yyyy-MM-dd')}" />
                            <button class="solid" type="submit">Done</button>
                        </form>
                        <form class="inline" method="post" th:action="@{/tasks/{id}/closed(id=${task.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="redirectTo" th:value="'/kanban?date=' + ${#temporals.format(kanban.selectedDate, 'yyyy-MM-dd')}" />
                            <button class="secondary" type="submit">Close</button>
                        </form>
                    </div>
                </article>
            </div>
            <p class="meta" th:if="${#lists.isEmpty(kanban.openTasks)}">No open tasks.</p>
        </section>

        <section class="column">
            <h2 th:text="'Done (' + ${kanban.doneTasks.size()} + ')'">Done</h2>
            <div class="stack" th:if="!${#lists.isEmpty(kanban.doneTasks)}">
                <article class="task" th:each="task : ${kanban.doneTasks}">
                    <div class="badges"><span class="badge done">DONE</span></div>
                    <h3 th:text="${task.title}">Task</h3>
                </article>
            </div>
            <p class="meta" th:if="${#lists.isEmpty(kanban.doneTasks)}">No done tasks.</p>
        </section>

        <section class="column">
            <h2 th:text="'Closed (' + ${kanban.closedTasks.size()} + ')'">Closed</h2>
            <div class="stack" th:if="!${#lists.isEmpty(kanban.closedTasks)}">
                <article class="task" th:each="task : ${kanban.closedTasks}">
                    <div class="badges"><span class="badge closed">CLOSED</span></div>
                    <h3 th:text="${task.title}">Task</h3>
                </article>
            </div>
            <p class="meta" th:if="${#lists.isEmpty(kanban.closedTasks)}">No closed tasks.</p>
        </section>
    </main>
</div>
</body>
</html>
