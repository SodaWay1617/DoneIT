<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>DoneIt Kanban</title>
    <style>
        :root {
            --bg: #f4efe6;
            --panel: #fffaf1;
            --ink: #1f2b2d;
            --muted: #607074;
            --accent: #1e6d73;
            --accent-soft: rgba(30, 109, 115, 0.09);
            --border: #d8cfbf;
            --danger: #9f4d36;
            --danger-soft: rgba(159, 77, 54, 0.1);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: linear-gradient(135deg, #efe7d9, var(--bg));
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
        }

        .shell { width: min(1180px, calc(100% - 24px)); margin: 24px auto 40px; }
        .hero, .column {
            border: 1px solid var(--border);
            border-radius: 22px;
            background: rgba(255, 250, 241, 0.94);
            padding: 22px;
        }
        .hero { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .nav, .date-picker, .badges, .task-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .nav, .date-picker { margin-top: 14px; }
        .pill, .ghost, .solid, .secondary, .date-input, .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 9px 13px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: white;
            color: inherit;
            font: inherit;
            text-decoration: none;
        }
        .solid { background: var(--accent); border-color: var(--accent); color: white; }
        .secondary { background: rgba(31, 43, 45, 0.06); }
        .badge { min-height: 28px; font-size: 0.82rem; }
        .badge.open { background: var(--accent-soft); color: var(--accent); }
        .badge.done { background: rgba(30, 109, 115, 0.12); }
        .badge.closed { background: var(--danger-soft); color: var(--danger); }
        .badge.priority-low { color: var(--muted); }
        .badge.priority-normal { color: var(--accent); }
        .badge.priority-high { color: var(--danger); border-color: rgba(159, 77, 54, 0.28); }
        .badge.priority-critical { color: white; background: var(--danger); border-color: var(--danger); }
        .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 16px; margin-top: 18px; overflow-x: auto; padding-bottom: 10px; }
        .column h2 { margin: 0 0 12px; font-size: 1.1rem; }
        .stack { display: grid; align-content: start; gap: 12px; min-height: 80px; }
        .task { padding: 14px; border: 1px solid var(--border); border-radius: 16px; background: white; }
        .task[draggable="true"] { cursor: grab; }
        .task.dragging { opacity: 0.42; }
        .stack.drag-target { outline: 2px dashed var(--accent); outline-offset: 6px; }
        .task h3 { margin: 8px 0 0; font-size: 1rem; }
        .meta { margin: 8px 0 0; color: var(--muted); }
        .task-actions { margin-top: 12px; }
        form.inline { margin: 0; }
        @media (max-width: 940px) { .board { grid-auto-columns: minmax(250px, 82vw); } }
    </style>
</head>
<body>
<form method='get' class='project-filter'><select name='projectId' onchange='this.form.submit()'><option value='' th:text="#{project.all}">All projects</option><option th:each='p:${projects}' th:value='${p.id}' th:text='${p.name}' th:selected='${p.id == selectedProjectId}'>Project</option></select> <a href='/projects' th:text="#{project.manage}">Manage projects</a></form>
<div class="shell">
    <section class="hero">
        <div>
            <p class="meta" th:text="#{common.signedInAs(${username})}">Signed in</p>
            <h1 th:text="#{kanban.title(${#temporals.format(kanban.selectedDate, 'dd MMM yyyy')})}">Kanban</h1>
            <div class="nav">
                <a class="pill" th:href="@{/}" th:text="#{nav.list}">List</a>
                <a class="pill" th:href="@{/kanban(date=${kanban.selectedDate})}" th:text="#{nav.kanban}">Kanban</a>
                <a class="pill" th:href="@{/calendar(month=${#temporals.format(kanban.selectedDate, 'yyyy-MM')})}" th:text="#{nav.calendar}">Calendar</a>
                <a class="pill" th:href="@{/analytics(month=${#temporals.format(kanban.selectedDate, 'yyyy-MM')})}" th:text="#{nav.analytics}">Analytics</a>
                <a class="ghost" th:href="@{/backlog}">Backlog</a>
                <a class="ghost" th:href="@{/inbox}">Inbox</a>
                <a class="ghost" th:href="@{/finished}">Done and closed</a>
                <a class="ghost" th:href="@{/settings}">Settings</a>
            </div>
            <form class="date-picker" method="get" th:action="@{/kanban}">
                <input class="date-input" type="date" name="date" th:value="${#temporals.format(kanban.selectedDate, 'yyyy-MM-dd')}" />
                <button class="secondary" type="submit">Open day</button>
            </form>
        </div>
        <a class="solid" th:href="@{/tasks/new}">Create task</a>
        <a class="ghost" th:href="@{/recurring/new}">Create recurring</a>
    </section>

    <main class="board">
        <section class="column" th:each="column : ${kanban.columns}">
            <h2 th:text="${@labels.status(column.status) + ' (' + column.tasks.size() + ')'}">STATUS (0)</h2>
            <div class="stack" th:attr="data-status=${column.status.name()}">
                <article class="task" draggable="true" th:each="task : ${column.tasks}" th:attr="data-task-id=${task.id}">
                    <div class="badges">
                        <span class="badge open" th:text="${task.status.displayName()}">Status</span>
                        <span class="badge" th:if="${task.priority.name() != 'NONE'}" th:classappend="${' priority-' + task.priority.name().toLowerCase()}" th:text="${task.priority.displayName()}">Priority</span>
                    </div>
                    <h3 th:text="${task.title}">Task</h3>
                    <p class="meta" th:if="${task.plannedForAt != null}" th:text="${#temporals.format(task.plannedForAt, 'HH:mm')}">09:00</p>
                    <p class="meta" th:if="${task.plannedDate != null}" th:text="${task.plannedDate}">Planned day</p>
                    <p class="meta" th:if="${task.description != null and !task.description.isBlank()}" th:text="${task.description}">Description</p>
                    <p class="meta" th:if="${task.estimateMinutes != null}" th:text="'Estimate: ' + ${task.estimateMinutes} + ' min'">Estimate</p>
                    <p class="meta" th:if="${task.spentMinutes > 0}" th:text="'Spent: ' + ${task.spentMinutes} + ' min'">Spent</p>
                    <div class="task-actions"><a class="ghost" th:href="@{/tasks/{id}/edit(id=${task.id})}">Edit</a><form class="inline track-time" method="post" th:action="@{/tasks/{id}/track-time(id=${task.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="redirectTo" th:value="'/kanban?date=' + ${kanban.selectedDate}"><input type="hidden" name="minutes"><button class="secondary track-time-button" type="button">Track time</button></form></div>
                </article>
                <th:block th:each="task : ${regularKanban}">
                    <article class="task" th:if="${task.status == column.status}">
                        <div class="badges"><span class="badge open" th:text="${task.status.displayName()}">Status</span><span class="badge">RECURRING</span></div>
                        <h3 th:text="${task.title}">Task</h3>
                        <p class="meta" th:text="${task.recurrenceType.displayName()}">Every day</p>
                        <p class="meta" th:if="${task.estimateMinutes != null}" th:text="'Estimate: ' + ${task.estimateMinutes} + ' min'">Estimate</p>
                        <p class="meta" th:if="${task.spentMinutes > 0}" th:text="'Spent: ' + ${task.spentMinutes} + ' min'">Spent</p>
                        <div class="task-actions"><a class="ghost" th:href="@{/recurring/{id}/edit(id=${task.id})}">Edit</a>
                        <form class="inline done-with-time" method="post" th:if="${task.regularStatus.name() == 'ACTIVE'}" th:action="@{/recurring/{id}/done-today(id=${task.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="date" th:value="${kanban.selectedDate}"><input type="hidden" name="redirectTo" th:value="'/kanban?date=' + ${kanban.selectedDate}"><input type="hidden" name="spentMinutes"><button class="solid">Done today</button>
                        </form></div>
                        <form class="inline track-time" method="post" th:action="@{/recurring/{id}/track-time(id=${task.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="date" th:value="${kanban.selectedDate}"><input type="hidden" name="redirectTo" th:value="'/kanban?date=' + ${kanban.selectedDate}"><input type="hidden" name="minutes"><button class="secondary track-time-button" type="button">Track time</button></form>
                    </article>
                </th:block>
            </div>
        </section>
    </main>
</div>
<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
    let draggedTask = null;
    let sourceColumn = null;

    document.querySelectorAll('.task[draggable="true"]').forEach(task => {
        task.addEventListener('dragstart', () => {
            draggedTask = task;
            sourceColumn = task.parentElement;
            task.classList.add('dragging');
        });
        task.addEventListener('dragend', () => {
            task.classList.remove('dragging');
            document.querySelectorAll('.stack').forEach(stack => stack.classList.remove('drag-target'));
        });
    });

    document.querySelectorAll('.stack[data-status]').forEach(stack => {
        stack.addEventListener('dragover', event => {
            event.preventDefault();
            stack.classList.add('drag-target');
            const next = [...stack.querySelectorAll('.task:not(.dragging)')]
                .find(task => event.clientY < task.getBoundingClientRect().top + task.offsetHeight / 2);
            stack.insertBefore(draggedTask, next || null);
        });
        stack.addEventListener('dragleave', () => stack.classList.remove('drag-target'));
        stack.addEventListener('drop', async event => {
            event.preventDefault();
            stack.classList.remove('drag-target');
            if (sourceColumn && sourceColumn !== stack) await saveColumn(sourceColumn);
            await saveColumn(stack);
            sourceColumn = stack;
        });
    });

    async function saveColumn(stack) {
        const body = new URLSearchParams();
        body.append('status', stack.dataset.status);
        stack.querySelectorAll('.task[data-task-id]').forEach(task => body.append('taskIds', task.dataset.taskId));
        if (![...stack.querySelectorAll('.task[data-task-id]')].length) return;
        const response = await fetch('/kanban/reorder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', [csrfHeader]: csrfToken },
            body
        });
        if (!response.ok) window.location.reload();
    }
</script>
<script src="/time-tracking.js"></script>
</body>
</html>
