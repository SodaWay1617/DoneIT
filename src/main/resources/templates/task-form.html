<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">Task Form</title>
    <style>
        :root {
            --bg: #f4efe6;
            --panel: #fffaf1;
            --ink: #1f2b2d;
            --muted: #607074;
            --accent: #1e6d73;
            --border: #d8cfbf;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background:
                radial-gradient(circle at top left, rgba(30, 109, 115, 0.12), transparent 28%),
                linear-gradient(135deg, #efe7d9, var(--bg));
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
        }

        .shell {
            width: min(820px, calc(100% - 24px));
            margin: 24px auto 40px;
            padding: 28px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: rgba(255, 250, 241, 0.96);
            box-shadow: 0 18px 48px rgba(31, 43, 45, 0.08);
        }

        h1 { margin-top: 0; }
        p { color: var(--muted); }
        form { display: grid; gap: 16px; }
        label { display: grid; gap: 8px; }
        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: white;
            color: var(--ink);
            font: inherit;
        }

        textarea { min-height: 120px; resize: vertical; }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .ghost, .solid {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            border-radius: 999px;
            text-decoration: none;
            border: 1px solid var(--border);
            color: inherit;
            background: white;
            font: inherit;
        }
        .solid {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .hint {
            padding: 14px;
            border-radius: 16px;
            background: rgba(30, 109, 115, 0.08);
            margin-bottom: 16px;
        }
        .error-summary {
            margin-bottom: 4px;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid #b15c4a;
            background: #fff1ed;
            color: #6f281a;
        }
        .field-error {
            color: #8b3020;
            font-size: 0.95rem;
        }
        .field-invalid {
            border-color: #b15c4a;
            background: #fff8f6;
        }
        .choice {
            display: flex;
            grid-template-columns: none;
            align-items: center;
            gap: 10px;
        }
        .choice input { width: auto; }
        .date-fields { display: grid; gap: 16px; }
        .date-fields[hidden] { display: none; }
    </style>
</head>
<body>
<div class="shell">
    <h1 th:text="${pageTitle}">Create Task</h1>
    <p th:text="'Signed in as ' + ${username}">Signed in as doneit</p>

    <div class="hint">
        <strong>Choose a day, an exact time, or leave both empty for a permanent active task.</strong>
        <p>Backlog is selected explicitly and stays outside the active flow.</p>
    </div>

    <form method="post" th:action="${formAction}" th:object="${form}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="error-summary" th:if="${#fields.hasErrors('*')}">
            <strong>Please fix the highlighted fields.</strong>
        </div>
        <input type="hidden" th:field="*{taskId}" />
        <label>
            Title
            <input type="text" th:field="*{title}" th:classappend="${#fields.hasErrors('title')} ? ' field-invalid'" placeholder="Task title" />
            <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</span>
        </label>
        <label th:if='${projects != null}'>
            Project
            <select th:field='*{projectId}' required>
                <option th:each='project : ${projects}' th:value='${project.id}' th:text='${project.name}'>Project</option>
            </select>
        </label>
        <label>
            Priority
            <select th:field="*{priority}">
                <option th:each="priorityValue : ${T(com.doneit.task.domain.TaskPriority).values()}"
                        th:value="${priorityValue}"
                        th:text="${priorityValue.displayName()}">None</option>
            </select>
        </label>
        <label class="choice"><input type="checkbox" th:field="*{backlog}" /> Put this task in backlog</label>
        <label class="choice"><input type="checkbox" th:field="*{permanent}" /> Permanent task</label>
        <label>
            Description
            <textarea th:field="*{description}" placeholder="Notes, details, links"></textarea>
        </label>
        <div id="dateFields" class="date-fields">
            <label>
                Planned day (without time)
                <input id="plannedDate" type="date" th:field="*{plannedDate}" />
            </label>
            <label>
                Planned for
                <input type="datetime-local" th:field="*{plannedForAt}" th:classappend="${#fields.hasErrors('plannedForAt')} ? ' field-invalid'" />
                <span class="field-error" th:if="${#fields.hasErrors('plannedForAt')}" th:errors="*{plannedForAt}">Planned time error</span>
            </label>
            <label>
                Deadline
                <input type="datetime-local" th:field="*{deadlineAt}" th:classappend="${#fields.hasErrors('deadlineAt')} ? ' field-invalid'" />
                <span class="field-error" th:if="${#fields.hasErrors('deadlineAt')}" th:errors="*{deadlineAt}">Deadline error</span>
            </label>
        </div>
        <div class="actions">
            <button class="solid" type="submit" th:text="${submitLabel}">Create task</button>
            <a class="ghost" th:href="@{/}">Back to tasks</a>
            <a class="ghost" th:href="@{/backlog}">Open backlog</a>
        </div>
    </form>
</div>
<script>
    const backlog = document.getElementById('backlog');
    const permanent = document.getElementById('permanent');
    const dateFields = document.getElementById('dateFields');
    const day = document.getElementById('plannedDate');
    const time = document.querySelector('[name=plannedForAt]');
    const deadline = document.querySelector('[name=deadlineAt]');

    function updateDateFields(changed) {
        if (changed === backlog && backlog.checked) permanent.checked = false;
        if (changed === permanent && permanent.checked) backlog.checked = false;
        const datesDisabled = backlog.checked || permanent.checked;
        dateFields.hidden = datesDisabled;
        if (datesDisabled) {
            day.value = '';
            time.value = '';
            deadline.value = '';
        }
    }

    backlog.addEventListener('change', () => updateDateFields(backlog));
    permanent.addEventListener('change', () => updateDateFields(permanent));
    day.addEventListener('input', () => { if (day.value) time.value = ''; });
    time.addEventListener('input', () => { if (time.value) day.value = ''; });
    updateDateFields();
</script>
</body>
</html>
