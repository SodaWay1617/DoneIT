<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="#{nav.finished}">Completed</title>
    <th:block th:replace="~{app-shell :: assets}"></th:block>
    <link rel="stylesheet" href="/today.css">
    <link rel="stylesheet" href="/compact-list.css">
    <link rel="stylesheet" href="/inbox.css">
    <link rel="stylesheet" href="/finished.css">
    <script src="/finished.js" defer></script>
</head>
<body class="app-page app-inbox app-finished">
<div th:replace="~{app-shell :: navigation}"></div>
<main class="app-content" id="app-main" tabindex="-1">
    <div class="inbox-shell finished-shell">
        <header class="inbox-header">
            <h1 th:text="#{nav.finished}">Completed</h1>
            <button class="today-button finished-filter-toggle" type="button" data-finished-filter aria-haspopup="dialog" aria-controls="finished-filter-dialog" th:classappend="${finished.filter.active()} ? 'is-active'"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span th:text="#{compact.filters}">Filters</span></button>
        </header>
        <nav class="finished-status-filter" th:aria-label="#{common.status}">
            <a th:href="${finished.filter.statusHref('ALL')}" th:classappend="${finished.filter.status == 'ALL'} ? 'is-active'" th:attr="aria-current=${finished.filter.status == 'ALL' ? 'true' : null}"><span th:text="#{finished.all}">All</span><span th:text="${finished.counts.total()}">0</span></a>
            <a th:href="${finished.filter.statusHref('DONE')}" th:classappend="${finished.filter.status == 'DONE'} ? 'is-active'" th:attr="aria-current=${finished.filter.status == 'DONE' ? 'true' : null}"><span th:text="#{finished.doneFilter}">Done</span><span th:text="${finished.counts.done}">0</span></a>
            <a th:href="${finished.filter.statusHref('CLOSED')}" th:classappend="${finished.filter.status == 'CLOSED'} ? 'is-active'" th:attr="aria-current=${finished.filter.status == 'CLOSED' ? 'true' : null}"><span th:text="#{finished.closedFilter}">Closed</span><span th:text="${finished.counts.closed}">0</span></a>
        </nav>
        <section class="compact-list inbox-list finished-list" th:if="${!finished.rows.isEmpty()}" th:aria-label="#{nav.finished}">
            <a class="finished-row" th:each="row : ${finished.rows}" th:href="${row.href(finished.returnTo())}" th:attr="data-task-id=${(row.recurring ? 'r' : 't') + row.id}">
                <h2 class="task-title" th:text="${row.title}">Task</h2>
                <span class="finished-state" th:classappend="${row.status.name() == 'DONE'} ? 'is-done' : 'is-closed'"><i th:attr="data-lucide=${row.status.name() == 'DONE' ? 'circle-check' : 'circle-x'}" aria-hidden="true"></i><span th:text="${row.status.name() == 'DONE' ? #messages.msg('finished.done') : #messages.msg('finished.closed')}">Done</span></span>
                <div class="finished-meta">
                    <div th:replace="~{task-row-summary :: metadata(${row.project}, ${row.tags}, ${row.recurring})}"></div>
                    <span class="finished-priority" th:if="${row.priority.name() != 'NONE'}" th:classappend="${'priority-' + row.priority.name().toLowerCase()}" th:text="${@labels.priority(row.priority)}">Normal</span>
                </div>
                <div class="finished-time" th:if="${row.estimateMinutes != null or row.actualMinutes != null}">
                    <span th:if="${row.estimateMinutes != null}" th:text="#{finished.estimate(${@labels.compactDuration(row.estimateMinutes)})}">Estimate: 45 min</span>
                    <span aria-hidden="true" th:if="${row.estimateMinutes != null and row.actualMinutes != null}"> · </span>
                    <span th:if="${row.actualMinutes != null}" th:text="#{finished.actual(${@labels.compactDuration(row.actualMinutes)})}">Actual: 35 min</span>
                </div>
                <div class="finished-date"><i data-lucide="calendar-days" aria-hidden="true"></i><time th:if="${row.finishedAt != null}" th:datetime="${row.finishedAt}" th:text="${#temporals.format(row.finishedAt, 'dd.MM.yyyy, HH:mm')}">26.10.2026, 19:42</time><span th:if="${row.finishedAt == null}" th:text="#{finished.noDate}">Date not specified</span></div>
            </a>
        </section>
        <div class="inbox-empty" th:if="${finished.rows.isEmpty()}">
            <h2 th:text="${finished.filter.active() ? #messages.msg('finished.noMatches') : #messages.msg('finished.empty')}">No completed tasks yet.</h2>
            <a class="today-button" th:if="${finished.filter.active()}" href="/finished" th:text="#{compact.reset}">Reset filters</a>
        </div>
        <footer th:replace="~{task-pagination :: controls(${finished}, ${finished.filter}, ${finished.filter.size}, #{finished.pagination})}"></footer>
    </div>
    <dialog class="compact-dialog" id="finished-filter-dialog" aria-labelledby="finished-filter-title">
        <form method="get" action="/finished">
            <header><h2 id="finished-filter-title" th:text="#{compact.filters}">Filters</h2><button class="cl-icon" type="button" data-close-dialog th:aria-label="#{common.cancel}"><i data-lucide="x" aria-hidden="true"></i></button></header>
            <input type="hidden" name="size" th:value="${finished.filter.size}">
            <label><span th:text="#{common.project}">Project</span><select name="projectId"><option value="" th:text="#{project.all}">All projects</option><option th:each="project : ${projects}" th:value="${project.id}" th:selected="${project.id == finished.filter.projectId}" th:text="${project.defaultProject ? 'MAIN' : #strings.arraySplit(project.name, '___')[0]}">Project</option></select></label>
            <label><span th:text="#{common.status}">Status</span><select name="status"><option value="ALL" th:selected="${finished.filter.status == 'ALL'}" th:text="#{finished.all}">All</option><option value="DONE" th:selected="${finished.filter.status == 'DONE'}" th:text="#{finished.doneFilter}">Done</option><option value="CLOSED" th:selected="${finished.filter.status == 'CLOSED'}" th:text="#{finished.closedFilter}">Closed</option></select></label>
            <fieldset th:if="${!finishedTags.isEmpty()}" class="finished-tag-choices"><legend th:text="#{tag.title}">Tags</legend><label th:each="tag : ${finishedTags}"><input type="checkbox" name="tagId" th:value="${tag.id}" th:checked="${finished.filter.tagged(tag.id)}"><span th:text="${'#' + tag.name}">#Prime</span></label></fieldset>
            <footer><a href="/finished" th:text="#{compact.reset}">Reset filters</a><button type="submit" th:text="#{finished.apply}">Apply</button></footer>
        </form>
    </dialog>
</main>
<script src="/reminders.js" defer></script>
</body></html>
