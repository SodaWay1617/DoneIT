learn.inviteHint=Восемь коротких тем: план дня, общие проекты и учёт времени. Прогресс сохраняется — можно продолжить позже.
learn.begin=Начать обучение
learn.0.title=Ваш день в DoneIt
learn.0.lead=DoneIt собирает личные и общие дела в одном месте, но не превращает каждую идею в обязательство.
learn.0.point1=Начните с «Сегодня»: здесь активные задачи выбранного дня и просроченные дела. Другой день можно открыть через выбор даты.
learn.0.point2=Во «Входящих» живут «Новая», в бэклоге — «Бэклог» и «Приостановлена». В активном списке — «Уточнение», «К выполнению», «В работе» и «Документация». «Выполнена» и «Закрыта» вынесены отдельно.
learn.0.point3=«Выполнена» означает «выполнено», «Закрыта» — «отменено». Проект объединяет задачи по смыслу, тип планирования отражает обязательность, а приоритет — важность.
learn.0.example=Идея поездки может ждать во «Входящих». Покупку билетов, когда всё понятно, можно перевести в «К выполнению» и запланировать на субботу.
learn.0.action=Открыть «Сегодня»
learn.1.title=Создание задачи
learn.1.lead=Начните с понятного действия. Добавляйте детали, которые действительно помогают выполнить задачу.
learn.1.point1=Выберите проект, название и статус. «Новая» — идея, «Бэклог» — принятое дело на потом, «Уточнение» — требует уточнения, «К выполнению» — можно выполнять.
learn.1.point2=Плановая дата — когда вы собираетесь заниматься задачей. Дедлайн — когда уже нужно закончить. Выбирайте дату или дату со временем. Для «Новая», «Бэклог» и «Приостановлена» плановые даты не нужны.
learn.1.point3=Оценка — оценка работы над самой задачей. Внутри крупной задачи можно создать подзадачи: их оценки и списания показываются отдельными суммами и не удваивают план дня.
learn.1.example=«Купить страховку»: «К выполнению», план на субботу, дедлайн во вторник, оценка 30 минут. Для эпика «Поездка» создайте её как подзадачу.
learn.1.action=Открыть создание задачи
learn.2.title=Список, канбан и календарь
learn.2.lead=Это разные представления одних задач. Изменение задачи отражается во всех представлениях.
learn.2.point1=Список удобен для быстрых действий и планирования дня. Фильтры проекта и типа планирования меняют выборку, но не сами задачи.
learn.2.point2=Канбан группирует задачи по статусам. Карточку можно перетащить в другой статус или изменить её порядок внутри колонки; порядок сохраняется.
learn.2.point3=Календарь показывает планы и дедлайны. Дедлайн выделяется красным; если обе даты совпали, карточка одна. В прошедших днях отображается списанное время, а не оставшиеся оценки.
learn.2.example=Страховка запланирована на 10-е, дедлайн 15-го: в календаре будет план 10-го и отметка дедлайна 15-го.
learn.2.action=Открыть канбан
learn.3.title=Регулярные задачи
learn.3.lead=Для привычек и повторяющихся дел создавайте регулярную задачу, а не новую задачу каждый день.
learn.3.point1=Выберите повторение по дням, будням, неделям, месяцам или годам. Можно задать интервал N дней, недель, месяцев или лет; будни повторяются каждый рабочий день. Время необязательно, дедлайна нет.
learn.3.point2=«Новая» и «Бэклог» — неактивная подготовка. «Уточнение», «В работе» и «Документация» включают повторения с даты старта. «К выполнению» и «Приостановлена» недоступны; активную регулярную задачу нельзя вернуть в подготовку.
learn.3.point3=«Выполнено сегодня» завершает только повторение этого дня и позволяет списать время. «Пропустить сегодня» убирает его на день без выполнения и карточки в календаре. «Выполнена» или «Закрыта» навсегда завершает всю серию, сохраняя историю.
learn.3.example=Йога раз в две недели по субботам: после занятия нажмите «Выполнено сегодня». Если пропускаете занятие — «Пропустить сегодня», а не «Закрыта».
learn.3.action=Создать регулярную задачу
learn.4.title=Проекты и совместная работа
learn.4.lead=Проект объединяет связанные дела. Видимая задача общего проекта не обязательно относится к вашей личной нагрузке.
learn.4.point1=MAIN — ваш защищённый проект по умолчанию. На экране «Проекты» нажмите «Новый проект», задайте название, код и описание. Проект можно открыть в списке, канбане или календаре.
learn.4.point2=Владелец редактирует проект и предоставляет доступ; участник может покинуть проект. Режимы видимости: все участники, только автор и исполнители, чужие задачи только в расписании. В последнем режиме чужие задачи доступны лишь для просмотра расписания и не видны в остальных разделах. Автор и исполнители продолжают управлять своими задачами.
learn.4.point3=В личную нагрузку входят назначенные вам задачи, а без исполнителей — ваши авторские. Передача другому человеку убирает оценку из вашей нагрузки, но не обязательно скрывает задачу. Каждый исполнитель получает полную оценку; списания и отчёты персональны.
learn.4.example=В «Работе» можно видеть Катиных клиентов без их оценок в своей нагрузке. В «Доме» режим автора и исполнителей скрывает от другого участника не относящиеся к нему дела.
learn.4.action=Открыть проекты
learn.5.title=Расписание и нагрузка дня
learn.5.lead=Планируйте не только объём дел, но и свободные промежутки между ними.
learn.5.point1=«Надо» — обязательства, «Хочу» — желаемые занятия, «Можно» — возможности. У «Хочу» пунктирная рамка, у «Можно» полупрозрачная карточка. Приоритет и статус выполнения независимы.
learn.5.point2=Оставшаяся нагрузка дня суммирует ваши активные оценки отдельно по трём типам. Выполненные задачи и повторения исключаются; без оценки длительность не добавляется. Пороги цветов нагрузки задаются в настройках.
learn.5.point3=Расписание показывает один день: ваша колонка слева, другие исполнители справа. Для блока нужны начало и оценка либо время окончания. Пересечения стоят рядом, задачи без интервала — отдельным списком.
learn.5.example=У Кати клиент с 10:00 до 11:30. По её блоку можно запланировать совместное дело после 11:30, не добавляя клиента в свою нагрузку.
learn.5.action=Открыть расписание
learn.6.title=Учёт времени и аналитика
learn.6.lead=Фактическое время вносится вручную. Аналитика помогает понять свой план, а не оценивает вас.
learn.6.point1=Нажмите «Записать время» или укажите минуты при выполнении. Записи суммируются, ваше время независимо от других участников. У регулярных задач списания относятся к дате повторения.
learn.6.point2=Plan / Fact сравнивает только выполненные задачи: оценку с вашим фактом. После выполнения оценка не исчезает из сравнения. Объединение времени подзадач зависит от настройки аналитики.
learn.6.point3=Аналитика нагрузки учитывает даты всех ваших списаний, включая незавершённые задачи. Смотрите распределение по проектам, категории планирования, переносы и отчёты за день, неделю, месяц или проект. История планов доступна только с начала её сохранения.
learn.6.example=Оценили в 30 минут, списали 45: после выполнения Plan / Fact покажет +50%. Эти 45 минут также попадут в фактическую нагрузку дня списания.
learn.6.action=Открыть аналитику
learn.7.title=Настройка под себя
learn.7.lead=Начните с небольшого реалистичного плана и уточняйте его по мере использования DoneIt.
learn.7.point1=В настройках выбираются язык, коды проектов в названиях задач, пороги нагрузки и аналитика подзадач. Возвращайтесь сюда, чтобы подстроить интерфейс под себя.
learn.7.point2=На личном устройстве можно выбрать запоминание входа на 90 дней. В настройках можно отозвать входы устройств. Пилот пока работает по HTTP: пароли и токены не шифруются при передаче; HTTPS запланирован.
learn.7.point3=Выберите несколько дел «Надо» на завтра, добавьте «Хочу», если остаётся время, и проверьте расписание. Обучение всегда доступно со страницы «Сегодня» и из настроек; оно не создаёт и не меняет ваши задачи.
learn.7.example=Попробуйте одну задачу с оценкой 30 минут: выполните и спишите факт. Этого достаточно, чтобы начать собирать полезную личную статистику.
learn.7.action=Открыть настройки

